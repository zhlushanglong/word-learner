<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6d4c41">
    <title>单词学习</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%);
            min-height: 100vh;
            padding: 15px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 100%;
            height: calc(100vh - 30px);
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部控制栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            margin-bottom: 12px;
            color: white;
        }
        
        .app-title {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .menu-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .menu-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        /* 加长的纸张效果容器 */
        .paper-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #fff8f0;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            padding: 20px;
            perspective: 1000px;
            touch-action: pan-y;
            border: 8px solid #6d4c41;
            background-image: 
                linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
                linear-gradient(#eee .1em, transparent .1em);
            background-size: 100% 1.2em;
            position: relative;
            min-height: 65vh; /* 加长显示区域 */
        }
        
        .paper-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 95%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
            border-radius: 12px;
        }
        
        /* 单词卡片容器 */
        .words-container {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s ease;
            pointer-events: none;
        }
        
        .page.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }
        
        .page.leaving {
            opacity: 0;
            transform: translateX(-100%);
        }
        
        .page.entering {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* 细长形单词卡片 */
        .word-card {
            position: absolute;
            background: #fff;
            border-radius: 8px; /* 更小的圆角 */
            padding: 10px 15px; /* 调整内边距 */
            box-shadow: 
                0 2px 8px rgba(0,0,0,0.1),
                inset 0 0 0 1px rgba(0,0,0,0.05),
                0 1px 2px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid #e0e0e0;
            transform-origin: center;
            user-select: none;
            z-index: 1;
            white-space: nowrap; /* 禁止换行 */
            overflow: hidden;
        }
        
        /* 细长形卡片尺寸 */
        .word-card.size-small {
            width: 140px;
            height: 50px;
        }
        
        .word-card.size-medium {
            width: 160px;
            height: 55px;
        }
        
        .word-card.size-large {
            width: 180px;
            height: 60px;
        }
        
        .word-card.size-xlarge {
            width: 200px;
            height: 65px;
        }
        
        .word-card:active {
            transform: scale(0.95);
            box-shadow: 
                0 1px 5px rgba(0,0,0,0.1),
                inset 0 0 0 1px rgba(0,0,0,0.05);
        }
        
        .word-card.showing-chinese {
            background: linear-gradient(135deg, #fff, #f3e5f5);
            border-color: #7b1fa2;
            box-shadow: 
                0 3px 12px rgba(123, 31, 162, 0.2),
                inset 0 0 0 1px rgba(123, 31, 162, 0.1);
            z-index: 2;
        }
        
        /* 单词文本样式 - 确保不换行 */
        .word-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }
        
        .word-english {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 3px;
            font-family: 'Georgia', 'Times New Roman', serif;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        
        .word-chinese {
            font-size: 14px;
            color: #7b1fa2;
            font-weight: 500;
            opacity: 0;
            transform: translateY(3px);
            transition: all 0.3s ease;
            font-family: 'STKaiti', 'KaiTi', serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        
        .word-card.showing-chinese .word-chinese {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 控制栏 */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            padding: 0 10px;
        }
        
        .control-btn {
            background: linear-gradient(135deg, #8d6e63, #5d4037);
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(93, 64, 55, 0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 120px;
            justify-content: center;
        }
        
        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 8px rgba(93, 64, 55, 0.2);
        }
        
        .control-btn.shuffle-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            box-shadow: 0 6px 16px rgba(255, 152, 0, 0.3);
        }
        
        /* 页码指示器 */
        .page-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            color: white;
        }
        
        .page-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .page-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        .page-info {
            font-size: 14px;
            min-width: 90px;
            text-align: center;
            font-weight: 500;
        }
        
        /* 菜单 */
        .menu {
            display: none;
            position: fixed;
            top: 65px;
            right: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            min-width: 200px;
            z-index: 1000;
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .menu-item {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        
        .menu-item:active {
            background: #f5f5f5;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-icon {
            margin-right: 10px;
            font-size: 18px;
            width: 22px;
            text-align: center;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 18px;
            padding: 22px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 16px 35px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 18px;
            color: #333;
            text-align: center;
        }
        
        .input-group {
            margin-bottom: 18px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #666;
            font-weight: 500;
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #8d6e63;
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-btn-confirm {
            background: #8d6e63;
            color: white;
        }
        
        .modal-btn-confirm:active {
            background: #5d4037;
        }
        
        .modal-btn-cancel {
            background: #f5f5f5;
            color: #666;
        }
        
        .modal-btn-cancel:active {
            background: #e0e0e0;
        }
        
        /* 提示信息 */
        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 3000;
            display: none;
            animation: toastSlideUp 0.3s ease;
        }
        
        @keyframes toastSlideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* 空状态 */
        .empty-state {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            max-width: 280px;
        }
        
        .empty-icon {
            font-size: 50px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        /* 页面切换动画 */
        .page-transition {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        /* 语音动画 */
        .speaking-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .word-card.speaking .speaking-dot {
            opacity: 1;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            
            .paper-container {
                padding: 16px;
                border-width: 6px;
                min-height: 70vh; /* 在手机上进一步加长 */
            }
            
            .control-bar {
                gap: 10px;
            }
            
            .control-btn {
                padding: 12px 16px;
                min-width: 110px;
                font-size: 13px;
            }
            
            .word-card.size-small {
                width: 120px;
                height: 45px;
            }
            
            .word-card.size-medium {
                width: 140px;
                height: 50px;
            }
            
            .word-card.size-large {
                width: 160px;
                height: 55px;
            }
            
            .word-card.size-xlarge {
                width: 180px;
                height: 60px;
            }
            
            .word-english {
                font-size: 15px;
            }
            
            .word-chinese {
                font-size: 13px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .paper-container {
                padding: 12px;
                border-width: 4px;
                min-height: 75vh; /* 在小屏幕上最长 */
            }
            
            .app-title {
                font-size: 18px;
            }
            
            .control-bar {
                flex-wrap: wrap;
            }
            
            .control-btn {
                min-width: calc(50% - 5px);
                padding: 10px 12px;
            }
            
            .word-card.size-small {
                width: 100px;
                height: 40px;
            }
            
            .word-card.size-medium {
                width: 120px;
                height: 45px;
            }
            
            .word-card.size-large {
                width: 140px;
                height: 50px;
            }
            
            .word-card.size-xlarge {
                width: 160px;
                height: 55px;
            }
            
            .word-english {
                font-size: 14px;
            }
            
            .word-chinese {
                font-size: 12px;
            }
        }
        
        /* 横屏模式 */
        @media (orientation: landscape) {
            .paper-container {
                min-height: 75vh;
            }
            
            .word-card.size-small {
                width: 130px;
                height: 45px;
            }
            
            .word-card.size-medium {
                width: 150px;
                height: 50px;
            }
            
            .word-card.size-large {
                width: 170px;
                height: 55px;
            }
            
            .word-card.size-xlarge {
                width: 190px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部控制栏 -->
        <div class="top-bar">
            <div class="app-title">
                <span>📚</span>
                <span>单词学习</span>
            </div>
            <button class="menu-btn" id="menuBtn">⋮</button>
        </div>
        
        <!-- 加长的纸张效果容器 -->
        <div class="paper-container" id="paperContainer">
            <!-- 页面内容会动态生成 -->
        </div>
        
        <!-- 控制栏 -->
        <div class="control-bar">
            <button class="control-btn" onclick="prevPage()">
                <span>◀</span> 上一页
            </button>
            <button class="control-btn shuffle-btn" onclick="shuffleCurrentPage()">
                <span>🔀</span> 乱序排列
            </button>
            <button class="control-btn" onclick="nextPage()">
                下一页 <span>▶</span>
            </button>
        </div>
        
        <!-- 页码指示器 -->
        <div class="page-indicator">
            <button class="page-btn" onclick="prevPage()">◀</button>
            <div class="page-info" id="pageInfo">第1页 / 共1页</div>
            <button class="page-btn" onclick="nextPage()">▶</button>
        </div>
    </div>
    
    <!-- 菜单 -->
    <div class="menu" id="menu">
        <div class="menu-item" onclick="showAddWordModal()">
            <div class="menu-icon">➕</div>
            <div>添加单词</div>
        </div>
        <div class="menu-item" onclick="showImportModal()">
            <div class="menu-icon">📥</div>
            <div>导入词库</div>
        </div>
        <div class="menu-item" onclick="exportWords()">
            <div class="menu-icon">📤</div>
            <div>导出词库</div>
        </div>
        <div class="menu-item" onclick="showClearModal()">
            <div class="menu-icon">🗑️</div>
            <div>清空词库</div>
        </div>
        <div class="menu-item" onclick="showHelp()">
            <div class="menu-icon">❓</div>
            <div>使用帮助</div>
        </div>
    </div>
    
    <!-- 添加单词模态框 -->
    <div class="modal" id="addWordModal">
        <div class="modal-content">
            <div class="modal-title">添加新单词</div>
            <div class="input-group">
                <label for="englishInput">英文单词</label>
                <input type="text" id="englishInput" placeholder="例如：hello" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="chineseInput">中文释义</label>
                <input type="text" id="chineseInput" placeholder="例如：你好" autocomplete="off">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideAddWordModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="addWord()">添加</button>
            </div>
        </div>
    </div>
    
    <!-- 导入模态框 -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <div class="modal-title">导入词库</div>
            <div style="margin-bottom: 20px; color: #666; line-height: 1.6;">
                请输入JSON格式的词库：<br>
                <span style="font-size: 12px; color: #999;">
                    示例：[{"english":"hello","chinese":"你好"}]
                </span>
            </div>
            <div class="input-group">
                <textarea id="importInput" placeholder="粘贴JSON内容..." rows="6"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideImportModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="importWords()">导入</button>
            </div>
        </div>
    </div>
    
    <!-- 清空确认模态框 -->
    <div class="modal" id="clearModal">
        <div class="modal-content">
            <div class="modal-title">⚠️ 确认清空</div>
            <div style="margin-bottom: 25px; color: #666; text-align: center;">
                确定要清空所有单词吗？<br>
                <span style="font-size: 14px; color: #f44336;">此操作不可撤销！</span>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideClearModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="clearWords()" style="background:#f44336;">清空</button>
            </div>
        </div>
    </div>
    
    <!-- 提示信息 -->
    <div class="toast" id="toast"></div>
    
    <script>
        // 词库数据 - 初始示例单词
        let words = [
            { english: 'apple', chinese: '苹果' },
            { english: 'banana', chinese: '香蕉' },
            { english: 'computer', chinese: '电脑' },
            { english: 'programming', chinese: '编程' },
            { english: 'development', chinese: '开发' },
            { english: 'hello', chinese: '你好' },
            { english: 'world', chinese: '世界' },
            { english: 'software', chinese: '软件' },
            { english: 'hardware', chinese: '硬件' },
            { english: 'network', chinese: '网络' },
            { english: 'database', chinese: '数据库' },
            { english: 'algorithm', chinese: '算法' },
            { english: 'variable', chinese: '变量' },
            { english: 'function', chinese: '函数' },
            { english: 'class', chinese: '类' },
            { english: 'object', chinese: '对象' },
            { english: 'interface', chinese: '接口' },
            { english: 'method', chinese: '方法' },
            { english: 'property', chinese: '属性' },
            { english: 'event', chinese: '事件' },
            { english: 'callback', chinese: '回调' },
            { english: 'promise', chinese: '承诺' },
            { english: 'async', chinese: '异步' },
            { english: 'await', chinese: '等待' },
            { english: 'framework', chinese: '框架' },
            { english: 'library', chinese: '库' },
            { english: 'module', chinese: '模块' },
            { english: 'package', chinese: '包' },
            { english: 'dependency', chinese: '依赖' },
            { english: 'configuration', chinese: '配置' },
            { english: 'environment', chinese: '环境' },
            { english: 'deployment', chinese: '部署' },
            { english: 'maintenance', chinese: '维护' },
            { english: 'optimization', chinese: '优化' },
            { english: 'performance', chinese: '性能' },
            { english: 'security', chinese: '安全' },
            { english: 'authentication', chinese: '认证' },
            { english: 'authorization', chinese: '授权' },
            { english: 'encryption', chinese: '加密' },
            { english: 'decryption', chinese: '解密' },
            { english: 'compression', chinese: '压缩' },
            { english: 'decompression', chinese: '解压' },
            { english: 'validation', chinese: '验证' },
            { english: 'verification', chinese: '校验' },
            { english: 'initialization', chinese: '初始化' },
            { english: 'termination', chinese: '终止' },
            { english: 'exception', chinese: '异常' },
            { english: 'error', chinese: '错误' },
            { english: 'debug', chinese: '调试' },
            { english: 'test', chinese: '测试' }
        ];
        
        const WORDS_PER_PAGE = 20;  // 每页显示20个单词
        let currentPage = 0;        // 当前页码（从0开始）
        let speech = null;          // 语音合成器
        let isSpeaking = false;     // 是否正在朗读
        let touchStartX = 0;        // 触摸开始X坐标
        let touchEndX = 0;          // 触摸结束X坐标
        
        // 显示提示信息
        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }
        
        // 初始化语音功能
        function initSpeech() {
            if ('speechSynthesis' in window) {
                speech = window.speechSynthesis;
            } else {
                showToast('您的浏览器不支持语音功能');
            }
        }
        
        // 朗读单词
        function speakWord(word, cardElement) {
            if (!speech) initSpeech();
            if (isSpeaking) return;
            
            // 标记正在朗读的卡片
            if (cardElement) {
                cardElement.classList.add('speaking');
            }
            
            isSpeaking = true;
            
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            utterance.pitch = 1.0;
            
            utterance.onstart = function() {
                if (cardElement) {
                    cardElement.classList.add('speaking');
                }
            };
            
            utterance.onend = function() {
                isSpeaking = false;
                if (cardElement) {
                    cardElement.classList.remove('speaking');
                }
            };
            
            utterance.onerror = function() {
                isSpeaking = false;
                if (cardElement) {
                    cardElement.classList.remove('speaking');
                }
                showToast('朗读失败，请重试');
            };
            
            speech.speak(utterance);
        }
        
        // 计算总页数
        function getTotalPages() {
            return Math.ceil(words.length / WORDS_PER_PAGE);
        }
        
        // 获取当前页的单词
        function getCurrentPageWords() {
            const startIndex = currentPage * WORDS_PER_PAGE;
            const endIndex = startIndex + WORDS_PER_PAGE;
            return words.slice(startIndex, endIndex);
        }
        
        // 获取卡片尺寸类别
        function getCardSize(wordLength) {
            if (wordLength <= 4) return 'size-small';
            if (wordLength <= 8) return 'size-medium';
            if (wordLength <= 12) return 'size-large';
            return 'size-xlarge';
        }
        
        // 生成纸张上的随机位置（针对细长形卡片）
        function generatePaperPositions(count) {
            const positions = [];
            const container = document.getElementById('paperContainer');
            const containerWidth = container.offsetWidth - 40;  // 减去边距
            const containerHeight = container.offsetHeight - 40;
            
            // 细长形卡片尺寸选项
            const cardSizes = [
                { width: 140, height: 50, class: 'size-small' },
                { width: 160, height: 55, class: 'size-medium' },
                { width: 180, height: 60, class: 'size-large' },
                { width: 200, height: 65, class: 'size-xlarge' }
            ];
            
            // 尝试放置卡片的次数
            let maxAttempts = 500;
            let attempts = 0;
            
            for (let i = 0; i < count && attempts < maxAttempts; i++) {
                const size = cardSizes[Math.floor(Math.random() * cardSizes.length)];
                
                let placed = false;
                let attemptCount = 0;
                
                while (!placed && attemptCount < 50) {
                    // 随机位置
                    const x = 20 + Math.random() * (containerWidth - size.width);
                    const y = 20 + Math.random() * (containerHeight - size.height);
                    
                    // 检查是否与其他卡片重叠
                    let overlap = false;
                    for (let j = 0; j < positions.length; j++) {
                        const otherPos = positions[j];
                        const dx = Math.abs(x - otherPos.x);
                        const dy = Math.abs(y - otherPos.y);
                        
                        // 重叠检测，细长形卡片需要更严格
                        if (dx < (size.width + otherPos.width) * 0.5 && 
                            dy < (size.height + otherPos.height) * 0.5) {
                            overlap = true;
                            break;
                        }
                    }
                    
                    if (!overlap) {
                        // 随机旋转角度（细长卡片旋转角度较小）
                        const rotation = -5 + Math.random() * 10;
                        
                        // 随机颜色（柔和的纸张色系）
                        const colors = [
                            { bg: '#fffef7', border: '#e8e4d8' },
                            { bg: '#f8f4e9', border: '#e2dcc9' },
                            { bg: '#f5f1e6', border: '#d9d4c3' },
                            { bg: '#f3eee0', border: '#d5cfbb' },
                            { bg: '#f0ebd9', border: '#d1cab4' }
                        ];
                        
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        positions.push({
                            x, y,
                            width: size.width,
                            height: size.height,
                            rotation,
                            ...color,
                            sizeClass: size.class
                        });
                        placed = true;
                    }
                    
                    attemptCount++;
                    attempts++;
                }
                
                // 如果无法放置，使用强制放置
                if (!placed) {
                    const size = cardSizes[Math.floor(Math.random() * cardSizes.length)];
                    const x = 20 + Math.random() * (containerWidth - size.width);
                    const y = 20 + Math.random() * (containerHeight - size.height);
                    const rotation = -5 + Math.random() * 10;
                    const colors = [
                        { bg: '#fffef7', border: '#e8e4d8' },
                        { bg: '#f8f4e9', border: '#e2dcc9' },
                        { bg: '#f5f1e6', border: '#d9d4c3' }
                    ];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    positions.push({
                        x, y,
                        width: size.width,
                        height: size.height,
                        rotation,
                        ...color,
                        sizeClass: size.class
                    });
                }
            }
            
            return positions;
        }
        
        // 渲染当前页面
        function renderCurrentPage() {
            const container = document.getElementById('paperContainer');
            const totalPages = getTotalPages();
            const pageWords = getCurrentPageWords();
            
            // 清空容器
            container.innerHTML = '';
            
            if (words.length === 0) {
                // 显示空状态
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <div class="empty-icon">📚</div>
                    <div class="empty-text">词库为空，开始添加单词吧！</div>
                    <button class="control-btn" onclick="showAddWordModal()" style="margin: 0 auto;">
                        <span>➕</span> 添加第一个单词
                    </button>
                `;
                container.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }
            
            // 创建页面容器
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page active';
            
            if (pageWords.length === 0) {
                const message = document.createElement('div');
                message.textContent = '本页没有单词';
                message.style.position = 'absolute';
                message.style.top = '50%';
                message.style.left = '50%';
                message.style.transform = 'translate(-50%, -50%)';
                message.style.color = '#666';
                pageDiv.appendChild(message);
            } else {
                // 生成随机位置
                const positions = generatePaperPositions(pageWords.length);
                
                // 创建单词卡片
                pageWords.forEach((word, index) => {
                    const pos = positions[index] || positions[0]; // 防止undefined
                    
                    const card = document.createElement('div');
                    card.className = `word-card ${pos.sizeClass}`;
                    
                    // 设置卡片样式
                    card.style.left = `${pos.x}px`;
                    card.style.top = `${pos.y}px`;
                    card.style.width = `${pos.width}px`;
                    card.style.height = `${pos.height}px`;
                    card.style.transform = `rotate(${pos.rotation}deg)`;
                    card.style.background = pos.bg;
                    card.style.borderColor = pos.border;
                    
                    // 添加内容容器
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'word-content';
                    
                    // 添加英文
                    const englishDiv = document.createElement('div');
                    englishDiv.className = 'word-english';
                    englishDiv.textContent = word.english;
                    englishDiv.title = word.english; // 添加tooltip
                    
                    // 添加中文
                    const chineseDiv = document.createElement('div');
                    chineseDiv.className = 'word-chinese';
                    chineseDiv.textContent = word.chinese;
                    chineseDiv.title = word.chinese; // 添加tooltip
                    
                    // 添加语音指示点
                    const speakingDot = document.createElement('div');
                    speakingDot.className = 'speaking-dot';
                    
                    contentDiv.appendChild(englishDiv);
                    contentDiv.appendChild(chineseDiv);
                    card.appendChild(contentDiv);
                    card.appendChild(speakingDot);
                    
                    // 点击事件
                    card.addEventListener('click', function(e) {
                        e.stopPropagation();
                        
                        // 朗读单词
                        speakWord(word.english, this);
                        
                        // 显示中文
                        this.classList.add('showing-chinese');
                        
                        // 5秒后自动隐藏中文
                        setTimeout(() => {
                            this.classList.remove('showing-chinese');
                        }, 5000);
                        
                        // 点击动画
                        this.style.transform = `rotate(${pos.rotation}deg) scale(1.05)`;
                        this.style.boxShadow = '0 6px 20px rgba(0,0,0,0.2)';
                        
                        setTimeout(() => {
                            this.style.transform = `rotate(${pos.rotation}deg) scale(1)`;
                            this.style.boxShadow = '';
                        }, 300);
                    });
                    
                    pageDiv.appendChild(card);
                });
            }
            
            container.appendChild(pageDiv);
            updatePageInfo();
        }
        
        // 更新页码信息
        function updatePageInfo() {
            const totalPages = getTotalPages();
            document.getElementById('pageInfo').textContent = 
                `第${currentPage + 1}页 / 共${totalPages}页`;
        }
        
        // 乱序当前页
        function shuffleCurrentPage() {
            const pageWords = getCurrentPageWords();
            if (pageWords.length === 0) return;
            
            // 重新渲染页面
            renderCurrentPage();
            showToast('当前页单词已重新排列');
            
            // 添加一些动画效果
            const cards = document.querySelectorAll('.word-card');
            cards.forEach((card, index) => {
                card.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.5) rotate(180deg)';
                
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'scale(1) rotate(0deg)';
                }, index * 50);
            });
            
            // 恢复默认过渡
            setTimeout(() => {
                cards.forEach(card => {
                    card.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                });
            }, 1000);
        }
        
        // 下一页
        function nextPage() {
            const totalPages = getTotalPages();
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderCurrentPage();
                animatePageTransition('next');
            }
        }
        
        // 上一页
        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderCurrentPage();
                animatePageTransition('prev');
            }
        }
        
        // 页面切换动画
        function animatePageTransition(direction) {
            const container = document.getElementById('paperContainer');
            
            // 创建临时遮罩层
            const overlay = document.createElement('div');
            overlay.className = 'page-transition';
            container.appendChild(overlay);
            
            // 淡出
            overlay.style.opacity = '0.3';
            
            // 淡入
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.remove();
                }, 300);
            }, 300);
        }
        
        // 触摸事件处理
        function initTouchEvents() {
            const container = document.getElementById('paperContainer');
            const SWIPE_THRESHOLD = 50; // 滑动阈值
            
            container.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            container.addEventListener('touchmove', function(e) {
                e.preventDefault(); // 防止页面滚动
            }, { passive: false });
            
            container.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                
                if (Math.abs(diff) > SWIPE_THRESHOLD) {
                    if (diff > 0) {
                        // 向右滑动，上一页
                        prevPage();
                    } else {
                        // 向左滑动，下一页
                        nextPage();
                    }
                }
            }, { passive: true });
        }
        
        // 菜单功能
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
        
        // 模态框功能
        function showAddWordModal() {
            document.getElementById('englishInput').value = '';
            document.getElementById('chineseInput').value = '';
            document.getElementById('addWordModal').style.display = 'flex';
            hideMenu();
        }
        
        function hideAddWordModal() {
            document.getElementById('addWordModal').style.display = 'none';
        }
        
        function showImportModal() {
            document.getElementById('importInput').value = '';
            document.getElementById('importModal').style.display = 'flex';
            hideMenu();
        }
        
        function hideImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }
        
        function showClearModal() {
            if (words.length === 0) {
                showToast('词库已为空');
                return;
            }
            document.getElementById('clearModal').style.display = 'flex';
            hideMenu();
        }
        
        function hideClearModal() {
            document.getElementById('clearModal').style.display = 'none';
        }
        
        function hideMenu() {
            document.getElementById('menu').style.display = 'none';
        }
        
        // 添加单词
        function addWord() {
            const english = document.getElementById('englishInput').value.trim();
            const chinese = document.getElementById('chineseInput').value.trim();
            
            if (!english) {
                showToast('请输入英文单词');
                document.getElementById('englishInput').focus();
                return;
            }
            
            if (!chinese) {
                showToast('请输入中文释义');
                document.getElementById('chineseInput').focus();
                return;
            }
            
            // 检查是否已存在
            const exists = words.some(w => w.english.toLowerCase() === english.toLowerCase());
            if (exists) {
                showToast('该单词已存在');
                return;
            }
            
            words.push({ english, chinese });
            
            // 如果添加后需要创建新页，跳转到新页
            const oldTotalPages = getTotalPages();
            const newTotalPages = Math.ceil(words.length / WORDS_PER_PAGE);
            
            if (newTotalPages > oldTotalPages) {
                currentPage = newTotalPages - 1;
            }
            
            updateDisplay();
            hideAddWordModal();
            showToast('单词添加成功！');
        }
        
        // 导入词库
        function importWords() {
            const json = document.getElementById('importInput').value.trim();
            
            if (!json) {
                showToast('请输入JSON内容');
                return;
            }
            
            try {
                const imported = JSON.parse(json);
                
                if (!Array.isArray(imported)) {
                    showToast('JSON必须是数组格式');
                    return;
                }
                
                // 验证格式
                for (let item of imported) {
                    if (!item.english || !item.chinese) {
                        showToast('每个单词必须包含english和chinese字段');
                        return;
                    }
                }
                
                words = imported;
                currentPage = 0;
                updateDisplay();
                hideImportModal();
                showToast(`成功导入${words.length}个单词`);
                
            } catch (e) {
                showToast('JSON格式错误，请检查');
                console.error(e);
            }
        }
        
        // 导出词库
        function exportWords() {
            if (words.length === 0) {
                showToast('词库为空，无法导出');
                return;
            }
            
            const json = JSON.stringify(words, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `单词词库_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            URL.revokeObjectURL(url);
            showToast('词库已导出为JSON文件');
        }
        
        // 清空词库
        function clearWords() {
            words = [];
            currentPage = 0;
            updateDisplay();
            hideClearModal();
            showToast('词库已清空');
        }
        
        // 显示帮助
        function showHelp() {
            const helpText = 
                '📱 使用帮助：\n\n' +
                '1. 点击单词卡片：朗读发音并显示中文\n' +
                '2. 左右滑动纸张：切换页面（每页20词）\n' +
                '3. 乱序排列按钮：重新随机排列当前页单词\n' +
                '4. 添加单词：右上角菜单 → 添加单词\n' +
                '5. 导入词库：支持JSON格式文件\n' +
                '6. 导出词库：备份当前词库\n\n' +
                '🎯 乱序排列：每次点击都会完全打乱位置\n' +
                '🔊 点击单词：自动朗读英文，显示中文5秒\n\n' +
                '📱 添加到主屏幕：\n' +
                '用Safari打开 → 分享 → 添加到主屏幕';
            
            alert(helpText);
            hideMenu();
        }
        
        // 更新显示
        function updateDisplay() {
            renderCurrentPage();
            saveToLocalStorage();
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            try {
                localStorage.setItem('wordLearnerData', JSON.stringify(words));
                localStorage.setItem('wordLearnerPage', currentPage.toString());
            } catch (e) {
                console.error('保存到本地存储失败:', e);
            }
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('wordLearnerData');
                if (saved) {
                    words = JSON.parse(saved);
                }
                
                const savedPage = localStorage.getItem('wordLearnerPage');
                if (savedPage) {
                    const page = parseInt(savedPage);
                    const totalPages = Math.ceil(words.length / WORDS_PER_PAGE);
                    if (!isNaN(page) && page >= 0 && page < totalPages) {
                        currentPage = page;
                    }
                }
            } catch (e) {
                console.error('从本地存储加载失败:', e);
            }
        }
        
        // 初始化
        function init() {
            initSpeech();
            loadFromLocalStorage();
            renderCurrentPage();
            initTouchEvents();
            
            // 菜单按钮事件
            document.getElementById('menuBtn').addEventListener('click', toggleMenu);
            
            // 点击其他地方关闭菜单
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.menu') && !e.target.closest('.menu-btn')) {
                    hideMenu();
                }
            });
            
            // 点击模态框外部关闭模态框
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                    }
                });
            });
            
            // 输入框回车键支持
            document.getElementById('englishInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('chineseInput').focus();
                }
            });
            
            document.getElementById('chineseInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addWord();
                }
            });
            
            // 窗口大小变化时重新渲染
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (words.length > 0) {
                        renderCurrentPage();
                    }
                }, 250);
            });
            
            // 注册Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js').then(
                        function(registration) {
                            console.log('ServiceWorker 注册成功:', registration.scope);
                        },
                        function(err) {
                            console.log('ServiceWorker 注册失败:', err);
                        }
                    );
                });
            }
            
            // 防止双击缩放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
