<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6d4c41">
    <title>单词学习</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%);
            min-height: 100vh;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 100%;
            height: calc(100vh - 20px);
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部控制栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            margin-bottom: 10px;
            color: white;
        }
        
        .app-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .menu-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .menu-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        /* 纸张效果容器 */
        .paper-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #fff8f0;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            padding: 15px;
            perspective: 1000px;
            touch-action: pan-y;
            border: 6px solid #6d4c41;
            background-image: 
                linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
                linear-gradient(#eee .1em, transparent .1em);
            background-size: 100% 1.2em;
            position: relative;
            min-height: 70vh;
        }
        
        .paper-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 95%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
            border-radius: 10px;
        }
        
        /* 分栏容器 */
        .columns-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            display: flex;
            gap: 10px;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
        }
        
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s ease;
            pointer-events: none;
        }
        
        .page.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }
        
        /* 单词项 - 垂直列表式 */
        .word-item {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            border: none;
            background: none;
            user-select: none;
            white-space: normal;
            overflow: hidden;
            padding: 8px 10px;
            border-radius: 6px;
            position: relative;
            min-height: 45px;
            width: 100%;
        }
        
        .word-item:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .word-item:active {
            background: rgba(123, 31, 162, 0.1);
            transform: scale(0.98);
        }
        
        .word-item.showing-chinese {
            background: rgba(123, 31, 162, 0.1);
            border-left: 3px solid #7b1fa2;
            min-height: 70px; /* 增加高度以容纳tip */
        }
        
        .word-item.showing-chinese .word-english {
            color: #d32f2f;
            font-weight: 700;
        }
        
        /* 单词文本样式 */
        .word-english {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 3px;
            font-family: 'Georgia', 'Times New Roman', serif;
            letter-spacing: -0.2px;
            line-height: 1.2;
            transition: all 0.3s ease;
            max-width: 100%;
        }
        
        .word-chinese {
            font-size: 14px;
            color: #7b1fa2;
            font-weight: 500;
            opacity: 0;
            transform: translateY(3px);
            transition: all 0.3s ease;
            font-family: 'STKaiti', 'KaiTi', serif;
            line-height: 1.2;
            max-width: 100%;
            margin-bottom: 2px;
        }
        
        .word-tip {
            font-size: 12px;
            color: #666;
            font-style: italic;
            opacity: 0;
            transform: translateY(3px);
            transition: all 0.3s ease;
            line-height: 1.3;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 4px;
            border-radius: 3px;
            border-left: 2px solid #ff9800;
        }
        
        .word-item.showing-chinese .word-chinese,
        .word-item.showing-chinese .word-tip {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 控制栏 */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            padding: 0 5px;
        }
        
        .control-btn {
            background: linear-gradient(135deg, #8d6e63, #5d4037);
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(93, 64, 55, 0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 110px;
            justify-content: center;
        }
        
        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(93, 64, 55, 0.2);
        }
        
        .control-btn.shuffle-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }
        
        /* 页码指示器 */
        .page-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            color: white;
        }
        
        .page-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .page-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        .page-info {
            font-size: 14px;
            min-width: 80px;
            text-align: center;
            font-weight: 500;
        }
        
        /* 菜单 */
        .menu {
            display: none;
            position: fixed;
            top: 60px;
            right: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            min-width: 180px;
            z-index: 1000;
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .menu-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        
        .menu-item:active {
            background: #f5f5f5;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-icon {
            margin-right: 10px;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 16px 35px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .modal-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #333;
            text-align: center;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #666;
            font-weight: 500;
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #8d6e63;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-btn-confirm {
            background: #8d6e63;
            color: white;
        }
        
        .modal-btn-confirm:active {
            background: #5d4037;
        }
        
        .modal-btn-cancel {
            background: #f5f5f5;
            color: #666;
        }
        
        .modal-btn-cancel:active {
            background: #e0e0e0;
        }
        
        /* 提示信息 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 3000;
            display: none;
            animation: toastSlideUp 0.3s ease;
        }
        
        @keyframes toastSlideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* 空状态 */
        .empty-state {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            max-width: 250px;
        }
        
        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        /* 页面切换动画 */
        .page-transition {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        /* 语音动画 */
        .speaking-dot {
            position: absolute;
            right: 5px;
            top: 5px;
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .word-item.speaking .speaking-dot {
            opacity: 1;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        
        /* 响应式调整 - iPhone 14特别优化 */
        @media (max-width: 430px) {
            body {
                padding: 8px;
            }
            
            .paper-container {
                padding: 12px;
                border-width: 5px;
                min-height: 75vh;
            }
            
            .columns-container {
                top: 12px;
                left: 12px;
                right: 12px;
                bottom: 12px;
                gap: 8px;
            }
            
            .column {
                padding: 8px;
                gap: 8px;
            }
            
            .control-bar {
                gap: 8px;
            }
            
            .control-btn {
                padding: 10px 14px;
                min-width: 100px;
                font-size: 13px;
            }
            
            .word-item {
                padding: 7px 9px;
                min-height: 42px;
            }
            
            .word-item.showing-chinese {
                min-height: 65px;
            }
            
            .word-english {
                font-size: 15px;
            }
            
            .word-chinese {
                font-size: 13px;
            }
            
            .word-tip {
                font-size: 11px;
            }
        }
        
        /* iPhone 14 Pro Max */
        @media (max-width: 430px) and (min-height: 900px) {
            .paper-container {
                min-height: 72vh;
            }
            
            .word-item {
                min-height: 45px;
                padding: 8px 10px;
            }
            
            .word-item.showing-chinese {
                min-height: 70px;
            }
        }
        
        /* 横屏模式 */
        @media (orientation: landscape) {
            .paper-container {
                min-height: 80vh;
            }
            
            .columns-container {
                gap: 15px;
            }
            
            .column {
                gap: 12px;
            }
            
            .word-english {
                font-size: 16px;
            }
            
            .word-chinese {
                font-size: 14px;
            }
            
            .word-tip {
                font-size: 12px;
            }
        }
        
        /* 屏幕很小时使用2列 */
        @media (max-width: 360px) {
            .columns-container {
                flex-direction: column;
                gap: 5px;
            }
            
            .column {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: space-between;
            }
            
            .word-item {
                width: calc(50% - 4px);
                min-height: 40px;
                padding: 6px 8px;
            }
            
            .word-item.showing-chinese {
                min-height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部控制栏 -->
        <div class="top-bar">
            <div class="app-title">
                <span>📚</span>
                <span>单词学习</span>
            </div>
            <button class="menu-btn" id="menuBtn">⋮</button>
        </div>
        
        <!-- 纸张效果容器 -->
        <div class="paper-container" id="paperContainer">
            <!-- 页面内容会动态生成 -->
        </div>
        
        <!-- 控制栏 -->
        <div class="control-bar">
            <button class="control-btn" onclick="prevPage()">
                <span>◀</span> 上一页
            </button>
            <button class="control-btn shuffle-btn" onclick="shuffleCurrentPage()">
                <span>🔀</span> 乱序排列
            </button>
            <button class="control-btn" onclick="nextPage()">
                下一页 <span>▶</span>
            </button>
        </div>
        
        <!-- 页码指示器 -->
        <div class="page-indicator">
            <button class="page-btn" onclick="prevPage()">◀</button>
            <div class="page-info" id="pageInfo">第1页 / 共1页</div>
            <button class="page-btn" onclick="nextPage()">▶</button>
        </div>
    </div>
    
    <!-- 菜单 -->
    <div class="menu" id="menu">
        <div class="menu-item" onclick="showAddWordModal()">
            <div class="menu-icon">➕</div>
            <div>添加单词</div>
        </div>
        <div class="menu-item" onclick="showImportModal()">
            <div class="menu-icon">📥</div>
            <div>导入词库</div>
        </div>
        <div class="menu-item" onclick="exportWords()">
            <div class="menu-icon">📤</div>
            <div>导出词库</div>
        </div>
        <div class="menu-item" onclick="showClearModal()">
            <div class="menu-icon">🗑️</div>
            <div>清空词库</div>
        </div>
        <div class="menu-item" onclick="showHelp()">
            <div class="menu-icon">❓</div>
            <div>使用帮助</div>
        </div>
    </div>
    
    <!-- 添加单词模态框 -->
    <div class="modal" id="addWordModal">
        <div class="modal-content">
            <div class="modal-title">添加新单词</div>
            <div class="input-group">
                <label for="englishInput">英文单词</label>
                <input type="text" id="englishInput" placeholder="例如：hello" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="chineseInput">中文释义</label>
                <input type="text" id="chineseInput" placeholder="例如：你好" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="tipInput">记忆窍门（可选）</label>
                <input type="text" id="tipInput" placeholder="例如：常考搭配、记忆方法" autocomplete="off">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideAddWordModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="addWord()">添加</button>
            </div>
        </div>
    </div>
    
    <!-- 导入模态框 -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <div class="modal-title">导入词库</div>
            <div style="margin-bottom: 20px; color: #666; line-height: 1.6;">
                请输入JSON格式的词库：<br>
                <span style="font-size: 12px; color: #999;">
                    示例：[{"english":"hello","chinese":"你好","tip":"常用问候语"}]
                </span>
            </div>
            <div class="input-group">
                <textarea id="importInput" placeholder="粘贴JSON内容..." rows="6"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideImportModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="importWords()">导入</button>
            </div>
        </div>
    </div>
    
    <!-- 清空确认模态框 -->
    <div class="modal" id="clearModal">
        <div class="modal-content">
            <div class="modal-title">⚠️ 确认清空</div>
            <div style="margin-bottom: 25px; color: #666; text-align: center;">
                确定要清空所有单词吗？<br>
                <span style="font-size: 14px; color: #f44336;">此操作不可撤销！</span>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideClearModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="clearWords()" style="background:#f44336;">清空</button>
            </div>
        </div>
    </div>
    
    <!-- 提示信息 -->
    <div class="toast" id="toast"></div>
    
    <script>
        // 词库数据 - 现在包含tip字段
        let words = [
            {
                "english": "Accept",
                "chinese": "接受",
                "tip": "Accept an invitation (接受邀请)"
            },
            {
                "english": "Achieve",

            },
            {

            },
            {
                "english": "Allow",

            },
            {
                "english": "Believe",

            },
            {
                "english": "Cause",
                "chinese": "导致/引起",
                "tip": "既是动词也是名词（原因）"
            },
            {
                "english": "Change",
                "chinese": "改变",
                "tip": "Change one's mind (改变主意)"
            },
            {
                "english": "Consider",
                "chinese": "考虑/认为",
                "tip": "Consider doing sth."
            },
            {
                "english": "Create",
                "chinese": "创造",
                "tip": "Create a new record (创造新纪录)"
            },
            {
                "english": "Decide",
                "chinese": "决定",
                "tip": "Decide to do sth."
            },
            {
                "english": "Develop",
                "chinese": "发展/开发",
                "tip": "Developed countries (发达国家)"
            },
            {
                "english": "Expect",
                "chinese": "期待/预料",
                "tip": "Expect sb. to do sth."
            },
            {
                "english": "Improve",
                "chinese": "提高/改善",
                "tip": "Improve English (提高英语)"
            },
            {
                "english": "Include",
                "chinese": "包括",
                "tip": "经常在阅读题的选项中出现"
            },
            {

                "tip": "反义词是 Decrease (减少)"
            },
            {
                "english": "Maintain",
                "chinese": "维持/保持",
                "tip": "Maintain health (保持健康)"
            },
            {
                "english": "Provide",
                "chinese": "提供",
                "tip": "Provide sth. for sb."
            },
            {
                "english": "Receive",
                "chinese": "收到",
                "tip": "收到信件、礼物等"
            },
            {
                "english": "Require",
                "chinese": "要求",
                "tip": "Requirement (名词：要求)"
            },
            {
                "english": "Suggest",
                "chinese": "建议",
                "tip": "后接 that 从句用 should + 动词原形"
            }
        ];
        
        const WORDS_PER_PAGE = 20;
        let currentPage = 0;
        let speech = null;
        let isSpeaking = false;
        let touchStartX = 0;
        let touchEndX = 0;
        
        // 显示提示信息
        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }
        
        // 初始化语音功能
        function initSpeech() {
            if ('speechSynthesis' in window) {
                speech = window.speechSynthesis;
            } else {
                showToast('您的浏览器不支持语音功能');
            }
        }
        
        // 朗读单词
        function speakWord(word, wordElement) {
            if (!speech) initSpeech();
            if (isSpeaking) return;
            
            if (wordElement) {
                wordElement.classList.add('speaking');
            }
            
            isSpeaking = true;
            
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            utterance.pitch = 1.0;
            
            utterance.onstart = function() {
                if (wordElement) {
                    wordElement.classList.add('speaking');
                }
            };
            
            utterance.onend = function() {
                isSpeaking = false;
                if (wordElement) {
                    wordElement.classList.remove('speaking');
                }
            };
            
            utterance.onerror = function() {
                isSpeaking = false;
                if (wordElement) {
                    wordElement.classList.remove('speaking');
                }
                showToast('朗读失败，请重试');
            };
            
            speech.speak(utterance);
        }
        
        // 计算总页数
        function getTotalPages() {
            return Math.ceil(words.length / WORDS_PER_PAGE);
        }
        
        // 获取当前页的单词
        function getCurrentPageWords() {
            const startIndex = currentPage * WORDS_PER_PAGE;
            const endIndex = startIndex + WORDS_PER_PAGE;
            return words.slice(startIndex, endIndex);
        }
        
        // 分栏布局算法
        function generateColumnLayout(wordList) {
            const pageWords = [...wordList];
            
            // 随机打乱单词顺序
            for (let i = pageWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pageWords[i], pageWords[j]] = [pageWords[j], pageWords[i]];
            }
            
            // 将单词分配到3列中
            const columns = [[], [], []];
            
            pageWords.forEach((word, index) => {
                const columnIndex = index % 3;
                columns[columnIndex].push(word);
            });
            
            return columns;
        }
        
        // 渲染当前页面
        function renderCurrentPage() {
            const container = document.getElementById('paperContainer');
            const totalPages = getTotalPages();
            const pageWords = getCurrentPageWords();
            
            // 清空容器
            container.innerHTML = '';
            
            if (words.length === 0) {
                // 显示空状态
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <div class="empty-icon">📚</div>
                    <div class="empty-text">词库为空，开始添加单词吧！</div>
                    <button class="control-btn" onclick="showAddWordModal()" style="margin: 0 auto;">
                        <span>➕</span> 添加第一个单词
                    </button>
                `;
                container.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }
            
            // 创建页面容器
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page active';
            
            // 创建分栏容器
            const columnsContainer = document.createElement('div');
            columnsContainer.className = 'columns-container';
            
            if (pageWords.length > 0) {
                // 生成分栏布局
                const columns = generateColumnLayout(pageWords);
                
                // 创建3列
                for (let colIndex = 0; colIndex < 3; colIndex++) {
                    const columnDiv = document.createElement('div');
                    columnDiv.className = 'column';
                    
                    // 为该列的每个单词创建单词项
                    columns[colIndex].forEach(word => {
                        const wordItem = document.createElement('div');
                        wordItem.className = 'word-item';
                        
                        // 添加英文
                        const englishDiv = document.createElement('div');
                        englishDiv.className = 'word-english';
                        englishDiv.textContent = word.english;
                        
                        // 添加中文
                        const chineseDiv = document.createElement('div');
                        chineseDiv.className = 'word-chinese';
                        chineseDiv.textContent = word.chinese;
                        
                        // 添加记忆窍门（如果有）
                        let tipDiv = null;
                        if (word.tip && word.tip.trim() !== '') {
                            tipDiv = document.createElement('div');
                            tipDiv.className = 'word-tip';
                            tipDiv.textContent = word.tip;
                        }
                        
                        // 添加语音指示点
                        const speakingDot = document.createElement('div');
                        speakingDot.className = 'speaking-dot';
                        
                        wordItem.appendChild(englishDiv);
                        wordItem.appendChild(chineseDiv);
                        if (tipDiv) {
                            wordItem.appendChild(tipDiv);
                        }
                        wordItem.appendChild(speakingDot);
                        
                        // 点击事件
                        wordItem.addEventListener('click', function(e) {
                            e.stopPropagation();
                            
                            // 朗读单词
                            speakWord(word.english, this);
                            
                            // 显示中文和记忆窍门
                            this.classList.add('showing-chinese');
                            
                            // 5秒后自动隐藏中文和记忆窍门
                            setTimeout(() => {
                                this.classList.remove('showing-chinese');
                            }, 5000);
                            
                            // 点击动画
                            this.style.transform = 'scale(0.98)';
                            
                            setTimeout(() => {
                                this.style.transform = 'scale(1)';
                            }, 200);
                        });
                        
                        columnDiv.appendChild(wordItem);
                    });
                    
                    columnsContainer.appendChild(columnDiv);
                }
            }
            
            pageDiv.appendChild(columnsContainer);
            container.appendChild(pageDiv);
            updatePageInfo();
        }
        
        // 更新页码信息
        function updatePageInfo() {
            const totalPages = getTotalPages();
            document.getElementById('pageInfo').textContent = 
                `第${currentPage + 1}页 / 共${totalPages}页`;
        }
        
        // 乱序当前页
        function shuffleCurrentPage() {
            const pageWords = getCurrentPageWords();
            if (pageWords.length === 0) return;
            
            // 重新渲染页面
            renderCurrentPage();
            showToast('当前页单词已重新排列');
            
            // 添加一些动画效果
            const wordItems = document.querySelectorAll('.word-item');
            wordItems.forEach((item, index) => {
                item.style.opacity = '0';
                item.style.transform = 'translateY(10px)';
                
                setTimeout(() => {
                    item.style.transition = 'all 0.4s ease';
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, index * 50);
            });
        }
        
        // 下一页
        function nextPage() {
            const totalPages = getTotalPages();
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderCurrentPage();
                animatePageTransition('next');
            }
        }
        
        // 上一页
        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderCurrentPage();
                animatePageTransition('prev');
            }
        }
        
        // 页面切换动画
        function animatePageTransition(direction) {
            const container = document.getElementById('paperContainer');
            
            const overlay = document.createElement('div');
            overlay.className = 'page-transition';
            container.appendChild(overlay);
            
            overlay.style.opacity = '0.3';
            
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.remove();
                }, 300);
            }, 300);
        }
        
        // 触摸事件处理
        function initTouchEvents() {
            const container = document.getElementById('paperContainer');
            const SWIPE_THRESHOLD = 50;
            
            container.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            container.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            container.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                
                if (Math.abs(diff) > SWIPE_THRESHOLD) {
                    if (diff > 0) {
                        prevPage();
                    } else {
                        nextPage();
                    }
                }
            }, { passive: true });
        }
        
        // 菜单功能
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
        
        // 模态框功能
        function showAddWordModal() {
            document.getElementById('englishInput').value = '';
            document.getElementById('chineseInput').value = '';
            document.getElementById('tipInput').value = '';
            document.getElementById('addWordModal').style.display = 'flex';
            hideMenu();
        }
        
        function hideAddWordModal() {
            document.getElementById('addWordModal').style.display = 'none';
        }
        
        function showImportModal() {
            document.getElementById('importInput').value = '';
            document.getElementById('importModal').style.display = 'flex';
            hideMenu();
        }
        
        function hideImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }
        
        function showClearModal() {
            if (words.length === 0) {
                showToast('词库已为空');
                return;
            }
            document.getElementById('clearModal').style.display = 'flex';
            hideMenu();
        }
        
        function hideClearModal() {
            document.getElementById('clearModal').style.display = 'none';
        }
        
        function hideMenu() {
            document.getElementById('menu').style.display = 'none';
        }
        
        // 添加单词（现在包含tip字段）
        function addWord() {
            const english = document.getElementById('englishInput').value.trim();
            const chinese = document.getElementById('chineseInput').value.trim();
            const tip = document.getElementById('tipInput').value.trim();
            
            if (!english) {
                showToast('请输入英文单词');
                document.getElementById('englishInput').focus();
                return;
            }
            
            if (!chinese) {
                showToast('请输入中文释义');
                document.getElementById('chineseInput').focus();
                return;
            }
            
            const exists = words.some(w => w.english.toLowerCase() === english.toLowerCase());
            if (exists) {
                showToast('该单词已存在');
                return;
            }
            
            words.push({ english, chinese, tip });
            
            const oldTotalPages = getTotalPages();
            const newTotalPages = Math.ceil(words.length / WORDS_PER_PAGE);
            
            if (newTotalPages > oldTotalPages) {
                currentPage = newTotalPages - 1;
            }
            
            updateDisplay();
            hideAddWordModal();
            showToast('单词添加成功！');
        }
        
        // 导入词库（现在支持tip字段）
        function importWords() {
            const json = document.getElementById('importInput').value.trim();
            
            if (!json) {
                showToast('请输入JSON内容');
                return;
            }
            
            try {
                const imported = JSON.parse(json);
                
                if (!Array.isArray(imported)) {
                    showToast('JSON必须是数组格式');
                    return;
                }
                
                // 验证格式（现在tip是可选的）
                for (let item of imported) {
                    if (!item.english || !item.chinese) {
                        showToast('每个单词必须包含english和chinese字段');
                        return;
                    }
                    // 确保tip字段存在（如果没有则设为空字符串）
                    if (item.tip === undefined) {
                        item.tip = '';
                    }
                }
                
                words = imported;
                currentPage = 0;
                updateDisplay();
                hideImportModal();
                showToast(`成功导入${words.length}个单词`);
                
            } catch (e) {
                showToast('JSON格式错误，请检查');
                console.error(e);
            }
        }
        
        // 导出词库（现在包含tip字段）
        function exportWords() {
            if (words.length === 0) {
                showToast('词库为空，无法导出');
                return;
            }
            
            const json = JSON.stringify(words, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `单词词库_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            URL.revokeObjectURL(url);
            showToast('词库已导出为JSON文件');
        }
        
        // 清空词库
        function clearWords() {
            words = [];
            currentPage = 0;
            updateDisplay();
            hideClearModal();
            showToast('词库已清空');
        }
        
        // 显示帮助
        function showHelp() {
            const helpText = 
                '📱 使用帮助：\n\n' +
                '1. 点击单词：朗读发音并显示中文和记忆窍门\n' +
                '2. 左右滑动纸张：切换页面（每页20词）\n' +
                '3. 乱序排列：重新排列当前页单词位置\n' +
                '4. 添加单词：右上角菜单 → 添加单词（可添加记忆窍门）\n' +
                '5. 导入词库：支持JSON格式文件（含tip字段）\n' +
                '6. 导出词库：备份当前词库（包含记忆窍门）\n\n' +
                '🔊 点击单词：自动朗读英文，显示中文和记忆窍门5秒\n\n' +
                '📱 添加到主屏幕：\n' +
                '用Safari打开 → 分享 → 添加到主屏幕';
            
            alert(helpText);
            hideMenu();
        }
        
        // 更新显示
        function updateDisplay() {
            renderCurrentPage();
            saveToLocalStorage();
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            try {
                localStorage.setItem('wordLearnerData', JSON.stringify(words));
                localStorage.setItem('wordLearnerPage', currentPage.toString());
            } catch (e) {
                console.error('保存到本地存储失败:', e);
            }
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('wordLearnerData');
                if (saved) {
                    words = JSON.parse(saved);
                }
                
                const savedPage = localStorage.getItem('wordLearnerPage');
                if (savedPage) {
                    const page = parseInt(savedPage);
                    const totalPages = Math.ceil(words.length / WORDS_PER_PAGE);
                    if (!isNaN(page) && page >= 0 && page < totalPages) {
                        currentPage = page;
                    }
                }
            } catch (e) {
                console.error('从本地存储加载失败:', e);
            }
        }
        
        // 初始化
        function init() {
            initSpeech();
            loadFromLocalStorage();
            renderCurrentPage();
            initTouchEvents();
            
            // 菜单按钮事件
            document.getElementById('menuBtn').addEventListener('click', toggleMenu);
            
            // 点击其他地方关闭菜单
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.menu') && !e.target.closest('.menu-btn')) {
                    hideMenu();
                }
            });
            
            // 点击模态框外部关闭模态框
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                    }
                });
            });
            
            // 输入框回车键支持
            document.getElementById('englishInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('chineseInput').focus();
                }
            });
            
            document.getElementById('chineseInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('tipInput').focus();
                }
            });
            
            document.getElementById('tipInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addWord();
                }
            });
            
            // 窗口大小变化时重新渲染
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (words.length > 0) {
                        renderCurrentPage();
                    }
                }, 250);
            });
            
            // 注册Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js').then(
                        function(registration) {
                            console.log('ServiceWorker 注册成功:', registration.scope);
                        },
                        function(err) {
                            console.log('ServiceWorker 注册失败:', err);
                        }
                    );
                });
            }
            
            // 防止双击缩放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
