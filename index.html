<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2196F3">
    <title>单词学习</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 30px;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 头部 */
        .header {
            text-align: center;
            color: white;
            padding: 15px 0;
            position: relative;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .word-count {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        /* 菜单按钮 */
        .menu-toggle {
            position: absolute;
            top: 15px;
            right: 0;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 22px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .menu-toggle:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        /* 菜单内容 */
        .menu {
            display: none;
            position: absolute;
            top: 65px;
            right: 0;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            min-width: 200px;
            z-index: 1000;
            overflow: hidden;
        }
        
        .menu-item {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        
        .menu-item:active {
            background: #f5f5f5;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-icon {
            margin-right: 12px;
            font-size: 20px;
            width: 24px;
            text-align: center;
        }
        
        /* 分页控制 */
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            color: white;
        }
        
        .page-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .page-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        .page-info {
            font-size: 16px;
            min-width: 100px;
            text-align: center;
        }
        
        /* 单词卡片区域 */
        .word-cards-container {
            background: rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 25px;
            margin: 15px 0;
            min-height: 500px;
            position: relative;
            overflow: hidden;
        }
        
        .word-cards-wrapper {
            position: relative;
            width: 100%;
            height: 500px;
            perspective: 1000px;
        }
        
        .word-card-item {
            position: absolute;
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            word-break: break-word;
            border: 3px solid transparent;
            transform-origin: center;
        }
        
        .word-card-item:active {
            transform: scale(0.95);
        }
        
        .word-card-item.showing-chinese {
            border-color: #4CAF50;
            background: linear-gradient(135deg, #ffffff, #f0fff0);
        }
        
        .word-english {
            font-size: 24px;
            font-weight: bold;
            color: #2196F3;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(33,150,243,0.1);
        }
        
        .word-chinese {
            font-size: 20px;
            color: #4CAF50;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        
        .word-card-item.showing-chinese .word-chinese {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 控制按钮区域 */
        .controls-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .control-btn {
            background: linear-gradient(135deg, #FF9800, #FF5722);
            border: none;
            border-radius: 20px;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255,87,34,0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
            justify-content: center;
        }
        
        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 5px 10px rgba(255,87,34,0.2);
        }
        
        .control-btn.prev-next {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            box-shadow: 0 10px 20px rgba(33,150,243,0.3);
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #2196F3;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-btn-confirm {
            background: #2196F3;
            color: white;
        }
        
        .modal-btn-confirm:active {
            background: #1976D2;
        }
        
        .modal-btn-cancel {
            background: #f5f5f5;
            color: #666;
        }
        
        .modal-btn-cancel:active {
            background: #e0e0e0;
        }
        
        /* 提示信息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 3000;
            display: none;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* 语音动画 */
        .speaking-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }
        
        .wave {
            position: absolute;
            border: 2px solid #2196F3;
            border-radius: 50%;
            animation: ripple 1.5s linear infinite;
        }
        
        .wave:nth-child(2) {
            animation-delay: 0.5s;
        }
        
        .wave:nth-child(3) {
            animation-delay: 1s;
        }
        
        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 80px;
                height: 80px;
                opacity: 0;
            }
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
            display: none;
        }
        
        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        
        .empty-text {
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .word-cards-container {
                padding: 15px;
                min-height: 450px;
            }
            
            .word-cards-wrapper {
                height: 450px;
            }
            
            .word-card-item {
                padding: 12px 15px;
            }
            
            .word-english {
                font-size: 20px;
            }
            
            .word-chinese {
                font-size: 18px;
            }
            
            .controls-area {
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .control-btn {
                min-width: 140px;
                padding: 16px 20px;
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .word-cards-container {
                min-height: 400px;
            }
            
            .word-cards-wrapper {
                height: 400px;
            }
            
            .word-card-item {
                padding: 10px 12px;
            }
            
            .word-english {
                font-size: 18px;
            }
            
            .word-chinese {
                font-size: 16px;
            }
            
            .control-btn {
                min-width: 120px;
                padding: 14px 15px;
                font-size: 15px;
            }
            
            .pagination-controls {
                gap: 8px;
            }
            
            .page-info {
                min-width: 80px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📚 单词学习</h1>
            <div class="word-count" id="wordCount">共5个单词</div>
            <button class="menu-toggle" id="menuToggle">⋮</button>
            <div class="menu" id="menu">
                <div class="menu-item" onclick="showAddWordModal()">
                    <div class="menu-icon">➕</div>
                    <div>添加单词</div>
                </div>
                <div class="menu-item" onclick="showImportModal()">
                    <div class="menu-icon">📥</div>
                    <div>导入词库</div>
                </div>
                <div class="menu-item" onclick="exportWords()">
                    <div class="menu-icon">📤</div>
                    <div>导出词库</div>
                </div>
                <div class="menu-item" onclick="showClearModal()">
                    <div class="menu-icon">🗑️</div>
                    <div>清空词库</div>
                </div>
                <div class="menu-item" onclick="showHelp()">
                    <div class="menu-icon">❓</div>
                    <div>使用帮助</div>
                </div>
            </div>
        </div>
        
        <!-- 分页控制 -->
        <div class="pagination-controls" id="paginationControls">
            <button class="page-btn" onclick="prevPage()">◀</button>
            <div class="page-info" id="pageInfo">第1页 / 共1页</div>
            <button class="page-btn" onclick="nextPage()">▶</button>
        </div>
        
        <!-- 单词卡片区域 -->
        <div class="word-cards-container">
            <div class="speaking-animation" id="speakingAnimation">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
            <div class="word-cards-wrapper" id="wordCardsWrapper">
                <!-- 单词卡片会动态生成在这里 -->
            </div>
        </div>
        
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📚</div>
            <div class="empty-text">词库为空，开始添加单词吧！</div>
            <button class="control-btn" onclick="showAddWordModal()">
                <span>➕</span> 添加第一个单词
            </button>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls-area" id="controlsArea">
            <button class="control-btn prev-next" onclick="prevPage()">
                <span>◀</span> 上一页
            </button>
            <button class="control-btn" onclick="shuffleCurrentPage()">
                <span>🔀</span> 乱序排列
            </button>
            <button class="control-btn prev-next" onclick="nextPage()">
                下一页 <span>▶</span>
            </button>
        </div>
    </div>
    
    <!-- 添加单词模态框 -->
    <div class="modal" id="addWordModal">
        <div class="modal-content">
            <div class="modal-title">添加新单词</div>
            <div class="input-group">
                <label for="englishInput">英文单词</label>
                <input type="text" id="englishInput" placeholder="例如：hello" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="chineseInput">中文释义</label>
                <input type="text" id="chineseInput" placeholder="例如：你好" autocomplete="off">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideAddWordModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="addWord()">添加</button>
            </div>
        </div>
    </div>
    
    <!-- 导入模态框 -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <div class="modal-title">导入词库</div>
            <div style="margin-bottom: 20px; color: #666; line-height: 1.6;">
                请输入JSON格式的词库：<br>
                <span style="font-size: 12px; color: #999;">
                    示例：[{"english":"hello","chinese":"你好"}]
                </span>
            </div>
            <div class="input-group">
                <textarea id="importInput" placeholder="粘贴JSON内容..." rows="6" 
                          style="width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:10px; font-size:14px;"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideImportModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="importWords()">导入</button>
            </div>
        </div>
    </div>
    
    <!-- 清空确认模态框 -->
    <div class="modal" id="clearModal">
        <div class="modal-content">
            <div class="modal-title">⚠️ 确认清空</div>
            <div style="margin-bottom: 25px; color: #666; text-align: center;">
                确定要清空所有单词吗？<br>
                <span style="font-size: 14px; color: #f44336;">此操作不可撤销！</span>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="hideClearModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="clearWords()" style="background:#f44336;">清空</button>
            </div>
        </div>
    </div>
    
    <!-- 提示信息 -->
    <div class="toast" id="toast"></div>
    
    <script>
        // 词库数据 - 初始示例单词（更多单词方便测试分页）
        let words = [
            { english: 'apple', chinese: '苹果' },
            { english: 'computer', chinese: '电脑' },
            { english: 'programming', chinese: '编程' },
            { english: 'development', chinese: '开发' },
            { english: 'hello', chinese: '你好' },
            { english: 'world', chinese: '世界' },
            { english: 'software', chinese: '软件' },
            { english: 'hardware', chinese: '硬件' },
            { english: 'network', chinese: '网络' },
            { english: 'database', chinese: '数据库' },
            { english: 'algorithm', chinese: '算法' },
            { english: 'variable', chinese: '变量' },
            { english: 'function', chinese: '函数' },
            { english: 'class', chinese: '类' },
            { english: 'object', chinese: '对象' },
            { english: 'interface', chinese: '接口' },
            { english: 'method', chinese: '方法' },
            { english: 'property', chinese: '属性' },
            { english: 'event', chinese: '事件' },
            { english: 'callback', chinese: '回调' },
            { english: 'promise', chinese: '承诺' },
            { english: 'async', chinese: '异步' },
            { english: 'await', chinese: '等待' },
            { english: 'framework', chinese: '框架' },
            { english: 'library', chinese: '库' },
            { english: 'module', chinese: '模块' },
            { english: 'package', chinese: '包' },
            { english: 'dependency', chinese: '依赖' },
            { english: 'configuration', chinese: '配置' },
            { english: 'environment', chinese: '环境' },
            { english: 'deployment', chinese: '部署' },
            { english: 'maintenance', chinese: '维护' },
            { english: 'optimization', chinese: '优化' },
            { english: 'performance', chinese: '性能' },
            { english: 'security', chinese: '安全' },
            { english: 'authentication', chinese: '认证' },
            { english: 'authorization', chinese: '授权' },
            { english: 'encryption', chinese: '加密' },
            { english: 'decryption', chinese: '解密' },
            { english: 'compression', chinese: '压缩' },
            { english: 'decompression', chinese: '解压' },
            { english: 'serialization', chinese: '序列化' },
            { english: 'deserialization', chinese: '反序列化' },
            { english: 'validation', chinese: '验证' },
            { english: 'verification', chinese: '校验' },
            { english: 'initialization', chinese: '初始化' },
            { english: 'termination', chinese: '终止' },
            { english: 'exception', chinese: '异常' },
            { english: 'error', chinese: '错误' },
            { english: 'debug', chinese: '调试' },
            { english: 'test', chinese: '测试' }
        ];
        
        const WORDS_PER_PAGE = 20;  // 每页显示20个单词
        let currentPage = 0;        // 当前页码（从0开始）
        let isSpeaking = false;
        let speech = null;
        let currentPageWords = [];  // 当前页的单词（乱序后的）
        
        // 显示提示信息
        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }
        
        // 初始化语音功能
        function initSpeech() {
            if ('speechSynthesis' in window) {
                speech = window.speechSynthesis;
                console.log('语音功能初始化成功');
            } else {
                showToast('您的浏览器不支持语音功能');
            }
        }
        
        // 朗读单词
        function speakWord(word) {
            if (!speech) initSpeech();
            
            // 显示语音动画
            const animation = document.getElementById('speakingAnimation');
            animation.style.opacity = '1';
            
            // 创建语音
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            utterance.pitch = 1.0;
            
            // 语音开始事件
            utterance.onstart = function() {
                isSpeaking = true;
            };
            
            // 语音结束事件
            utterance.onend = function() {
                isSpeaking = false;
                animation.style.opacity = '0';
            };
            
            // 语音错误事件
            utterance.onerror = function() {
                isSpeaking = false;
                animation.style.opacity = '0';
                showToast('朗读失败，请重试');
            };
            
            // 开始朗读
            speech.speak(utterance);
        }
        
        // 获取当前页的单词
        function getCurrentPageWords() {
            const startIndex = currentPage * WORDS_PER_PAGE;
            const endIndex = startIndex + WORDS_PER_PAGE;
            return words.slice(startIndex, endIndex);
        }
        
        // 计算总页数
        function getTotalPages() {
            return Math.ceil(words.length / WORDS_PER_PAGE);
        }
        
        // 生成随机位置
        function generateRandomPositions(count) {
            const positions = [];
            const containerWidth = document.getElementById('wordCardsWrapper').offsetWidth;
            const containerHeight = document.getElementById('wordCardsWrapper').offsetHeight;
            
            for (let i = 0; i < count; i++) {
                // 随机生成字体大小 (16px - 32px)
                const fontSize = 16 + Math.random() * 16;
                
                // 随机生成卡片大小
                const wordLength = currentPageWords[i].english.length;
                const baseSize = Math.max(80, wordLength * fontSize * 0.8);
                const width = baseSize + Math.random() * 40;
                const height = width * 0.8;
                
                // 随机位置，确保卡片在容器内
                const maxX = containerWidth - width - 20;
                const maxY = containerHeight - height - 20;
                
                let x, y;
                let attempts = 0;
                let validPosition = false;
                
                // 尝试找到不重叠的位置
                while (!validPosition && attempts < 100) {
                    x = 10 + Math.random() * maxX;
                    y = 10 + Math.random() * maxY;
                    
                    validPosition = true;
                    
                    // 检查是否与其他卡片重叠
                    for (let j = 0; j < positions.length; j++) {
                        const otherPos = positions[j];
                        const distance = Math.sqrt(
                            Math.pow(x - otherPos.x, 2) + 
                            Math.pow(y - otherPos.y, 2)
                        );
                        
                        // 如果距离太近，认为重叠
                        if (distance < (width + otherPos.width) * 0.6) {
                            validPosition = false;
                            break;
                        }
                    }
                    
                    attempts++;
                }
                
                // 如果找不到合适位置，使用随机位置
                if (!validPosition) {
                    x = 10 + Math.random() * maxX;
                    y = 10 + Math.random() * maxY;
                }
                
                // 随机旋转角度 (-15度 到 15度)
                const rotation = -15 + Math.random() * 30;
                
                // 随机颜色
                const hue = Math.floor(Math.random() * 360);
                const bgColor = `hsl(${hue}, 90%, 95%)`;
                const borderColor = `hsl(${hue}, 70%, 70%)`;
                
                positions.push({
                    x, y, width, height, rotation,
                    fontSize, bgColor, borderColor
                });
            }
            
            return positions;
        }
        
        // 渲染单词卡片
        function renderWordCards() {
            const wrapper = document.getElementById('wordCardsWrapper');
            wrapper.innerHTML = '';
            
            if (currentPageWords.length === 0) {
                document.getElementById('wordCardsContainer').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('paginationControls').style.display = 'none';
                document.getElementById('controlsArea').style.display = 'none';
                return;
            }
            
            document.getElementById('wordCardsContainer').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('paginationControls').style.display = 'flex';
            document.getElementById('controlsArea').style.display = 'flex';
            
            // 生成随机位置
            const positions = generateRandomPositions(currentPageWords.length);
            
            // 创建卡片元素
            currentPageWords.forEach((word, index) => {
                const pos = positions[index];
                
                const card = document.createElement('div');
                card.className = 'word-card-item';
                card.dataset.index = index;
                
                // 设置卡片样式
                card.style.left = `${pos.x}px`;
                card.style.top = `${pos.y}px`;
                card.style.width = `${pos.width}px`;
                card.style.height = `${pos.height}px`;
                card.style.transform = `rotate(${pos.rotation}deg)`;
                card.style.background = pos.bgColor;
                card.style.borderColor = pos.borderColor;
                card.style.zIndex = index;
                
                // 创建内容
                const englishDiv = document.createElement('div');
                englishDiv.className = 'word-english';
                englishDiv.textContent = word.english;
                englishDiv.style.fontSize = `${pos.fontSize}px`;
                
                const chineseDiv = document.createElement('div');
                chineseDiv.className = 'word-chinese';
                chineseDiv.textContent = word.chinese;
                chineseDiv.style.fontSize = `${pos.fontSize * 0.8}px`;
                
                card.appendChild(englishDiv);
                card.appendChild(chineseDiv);
                
                // 点击事件
                card.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    // 朗读单词
                    speakWord(word.english);
                    
                    // 显示中文
                    this.classList.add('showing-chinese');
                    
                    // 3秒后自动隐藏中文
                    setTimeout(() => {
                        this.classList.remove('showing-chinese');
                    }, 3000);
                    
                    // 点击动画
                    this.style.zIndex = 999;
                    this.style.transform = `rotate(${pos.rotation}deg) scale(1.1)`;
                    this.style.boxShadow = '0 15px 35px rgba(0,0,0,0.2)';
                    
                    setTimeout(() => {
                        this.style.transform = `rotate(${pos.rotation}deg) scale(1)`;
                        this.style.boxShadow = '';
                        setTimeout(() => {
                            this.style.zIndex = index;
                        }, 300);
                    }, 300);
                });
                
                wrapper.appendChild(card);
            });
            
            // 更新页码信息
            updatePageInfo();
        }
        
        // 更新页码信息
        function updatePageInfo() {
            const totalPages = getTotalPages();
            document.getElementById('pageInfo').textContent = 
                `第${currentPage + 1}页 / 共${totalPages}页`;
            document.getElementById('wordCount').textContent = 
                `共${words.length}个单词`;
                
            // 更新按钮状态
            const prevBtns = document.querySelectorAll('.page-btn, .control-btn.prev-next');
            prevBtns.forEach(btn => {
                if (btn.onclick && btn.onclick.toString().includes('prevPage')) {
                    btn.style.opacity = currentPage === 0 ? '0.5' : '1';
                    btn.disabled = currentPage === 0;
                }
                if (btn.onclick && btn.onclick.toString().includes('nextPage')) {
                    btn.style.opacity = currentPage === totalPages - 1 ? '0.5' : '1';
                    btn.disabled = currentPage === totalPages - 1;
                }
            });
        }
        
        // 乱序当前页
        function shuffleCurrentPage() {
            if (currentPageWords.length === 0) {
                showToast('当前页没有单词');
                return;
            }
            
            // Fisher-Yates 洗牌算法
            for (let i = currentPageWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentPageWords[i], currentPageWords[j]] = [currentPageWords[j], currentPageWords[i]];
            }
            
            // 重新渲染卡片
            renderWordCards();
            showToast('当前页单词已重新排列');
            
            // 乱序动画效果
            const cards = document.querySelectorAll('.word-card-item');
            cards.forEach((card, index) => {
                card.style.transition = 'all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                
                // 先消失
                setTimeout(() => {
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.5) rotate(180deg)';
                }, index * 50);
                
                // 再出现
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'scale(1) rotate(0deg)';
                }, 500 + index * 50);
            });
            
            // 恢复默认过渡
            setTimeout(() => {
                cards.forEach(card => {
                    card.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                });
            }, 1500);
        }
        
        // 下一页
        function nextPage() {
            const totalPages = getTotalPages();
            if (currentPage < totalPages - 1) {
                currentPage++;
                currentPageWords = getCurrentPageWords();
                renderWordCards();
                
                // 翻页动画
                const wrapper = document.getElementById('wordCardsWrapper');
                wrapper.style.opacity = '0';
                setTimeout(() => {
                    wrapper.style.opacity = '1';
                }, 300);
            }
        }
        
        // 上一页
        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                currentPageWords = getCurrentPageWords();
                renderWordCards();
                
                // 翻页动画
                const wrapper = document.getElementById('wordCardsWrapper');
                wrapper.style.opacity = '0';
                setTimeout(() => {
                    wrapper.style.opacity = '1';
                }, 300);
            }
        }
        
        // 显示添加单词模态框
        function showAddWordModal() {
            document.getElementById('englishInput').value = '';
            document.getElementById('chineseInput').value = '';
            document.getElementById('addWordModal').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('englishInput').focus();
            }, 100);
        }
        
        // 隐藏添加单词模态框
        function hideAddWordModal() {
            document.getElementById('addWordModal').style.display = 'none';
        }
        
        // 添加单词
        function addWord() {
            const english = document.getElementById('englishInput').value.trim();
            const chinese = document.getElementById('chineseInput').value.trim();
            
            if (!english) {
                showToast('请输入英文单词');
                document.getElementById('englishInput').focus();
                return;
            }
            
            if (!chinese) {
                showToast('请输入中文释义');
                document.getElementById('chineseInput').focus();
                return;
            }
            
            // 检查是否已存在
            const exists = words.some(w => w.english.toLowerCase() === english.toLowerCase());
            if (exists) {
                showToast('该单词已存在');
                return;
            }
            
            words.push({ english, chinese });
            
            // 如果添加后需要创建新页，跳转到新页
            const oldTotalPages = getTotalPages();
            const newTotalPages = Math.ceil(words.length / WORDS_PER_PAGE);
            
            if (newTotalPages > oldTotalPages) {
                currentPage = newTotalPages - 1;
            }
            
            currentPageWords = getCurrentPageWords();
            updateDisplay();
            hideAddWordModal();
            showToast('单词添加成功！');
        }
        
        // 显示导入模态框
        function showImportModal() {
            document.getElementById('importInput').value = '';
            document.getElementById('importModal').style.display = 'flex';
        }
        
        // 隐藏导入模态框
        function hideImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }
        
        // 导入词库
        function importWords() {
            const json = document.getElementById('importInput').value.trim();
            
            if (!json) {
                showToast('请输入JSON内容');
                return;
            }
            
            try {
                const imported = JSON.parse(json);
                
                if (!Array.isArray(imported)) {
                    showToast('JSON必须是数组格式');
                    return;
                }
                
                // 验证格式
                for (let item of imported) {
                    if (!item.english || !item.chinese) {
                        showToast('每个单词必须包含english和chinese字段');
                        return;
                    }
                }
                
                words = imported;
                currentPage = 0;
                currentPageWords = getCurrentPageWords();
                updateDisplay();
                hideImportModal();
                showToast(`成功导入${words.length}个单词`);
                
            } catch (e) {
                showToast('JSON格式错误，请检查');
                console.error(e);
            }
        }
        
        // 导出词库
        function exportWords() {
            if (words.length === 0) {
                showToast('词库为空，无法导出');
                return;
            }
            
            const json = JSON.stringify(words, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            // 创建下载链接
            const a = document.createElement('a');
            a.href = url;
            a.download = `我的词库_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            URL.revokeObjectURL(url);
            showToast('词库已导出为JSON文件');
        }
        
        // 显示清空确认模态框
        function showClearModal() {
            if (words.length === 0) {
                showToast('词库已为空');
                return;
            }
            document.getElementById('clearModal').style.display = 'flex';
        }
        
        // 隐藏清空确认模态框
        function hideClearModal() {
            document.getElementById('clearModal').style.display = 'none';
        }
        
        // 清空词库
        function clearWords() {
            words = [];
            currentPage = 0;
            currentPageWords = [];
            updateDisplay();
            hideClearModal();
            showToast('词库已清空');
        }
        
        // 显示帮助
        function showHelp() {
            const helpText = 
                '💡 使用帮助：\n\n' +
                '1. 点击任意单词卡片：朗读发音并显示中文\n' +
                '2. 左右翻页按钮：切换不同页面（每页20词）\n' +
                '3. 乱序排列按钮：重新随机排列当前页单词\n' +
                '4. 添加单词：右上角菜单 → 添加单词\n' +
                '5. 导入词库：支持JSON格式文件\n' +
                '6. 导出词库：备份当前词库\n\n' +
                '📱 点击单词时：自动朗读英文，显示中文3秒\n' +
                '🎯 乱序排列：每次点击都会完全打乱位置\n\n' +
                '📱 添加到主屏幕：\n' +
                '用Safari打开 → 分享 → 添加到主屏幕';
            
            alert(helpText);
        }
        
        // 更新显示
        function updateDisplay() {
            currentPageWords = getCurrentPageWords();
            renderWordCards();
            saveToLocalStorage();
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            try {
                localStorage.setItem('wordLearnerData', JSON.stringify(words));
                localStorage.setItem('wordLearnerPage', currentPage.toString());
            } catch (e) {
                console.error('保存到本地存储失败:', e);
            }
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('wordLearnerData');
                if (saved) {
                    words = JSON.parse(saved);
                }
                
                const savedPage = localStorage.getItem('wordLearnerPage');
                if (savedPage) {
                    const page = parseInt(savedPage);
                    const totalPages = Math.ceil(words.length / WORDS_PER_PAGE);
                    if (!isNaN(page) && page >= 0 && page < totalPages) {
                        currentPage = page;
                    }
                }
            } catch (e) {
                console.error('从本地存储加载失败:', e);
            }
        }
        
        // 菜单切换
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
        
        // 初始化
        function init() {
            initSpeech();
            loadFromLocalStorage();
            currentPageWords = getCurrentPageWords();
            updateDisplay();
            
            // 菜单按钮事件
            document.getElementById('menuToggle').addEventListener('click', toggleMenu);
            
            // 点击其他地方关闭菜单
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.menu') && !e.target.closest('.menu-toggle')) {
                    document.getElementById('menu').style.display = 'none';
                }
            });
            
            // 点击模态框外部关闭模态框
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.style.display = 'none';
                    }
                });
            });
            
            // 输入框回车键支持
            document.getElementById('englishInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('chineseInput').focus();
                }
            });
            
            document.getElementById('chineseInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addWord();
                }
            });
            
            // 窗口大小变化时重新布局
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (currentPageWords.length > 0) {
                        renderWordCards();
                    }
                }, 250);
            });
            
            // 注册Service Worker（PWA）
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').then(
                        registration => {
                            console.log('ServiceWorker 注册成功:', registration.scope);
                        },
                        err => {
                            console.log('ServiceWorker 注册失败:', err);
                        }
                    );
                });
            }
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
