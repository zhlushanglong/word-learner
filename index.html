<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6d4c41">
    <title>单词学习</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%);
            min-height: 100vh;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 100%;
            height: calc(100vh - 20px);
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部控制栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            margin-bottom: 10px;
            color: white;
        }
        
        .app-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .menu-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .menu-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        /* 纸张效果容器 */
        .paper-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #fff8f0;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            padding: 15px;
            perspective: 1000px;
            touch-action: pan-y;
            border: 6px solid #6d4c41;
            background-image: 
                linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
                linear-gradient(#eee .1em, transparent .1em);
            background-size: 100% 1.2em;
            position: relative;
            min-height: 70vh;
        }
        
        .paper-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 95%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
            border-radius: 10px;
        }
        
        /* 分栏容器 */
        .columns-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            display: flex;
            gap: 10px;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
        }
        
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s ease;
            pointer-events: none;
        }
        
        .page.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }
        
        /* 单词项 */
        .word-item {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            border: none;
            background: none;
            user-select: none;
            white-space: normal;
            overflow: hidden;
            padding: 8px 10px;
            border-radius: 6px;
            position: relative;
            min-height: 45px;
            width: 100%;
        }
        
        .word-item:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .word-item:active {
            background: rgba(123, 31, 162, 0.1);
            transform: scale(0.98);
        }
        
        .word-item.showing-chinese {
            background: rgba(123, 31, 162, 0.1);
            border-left: 3px solid #7b1fa2;
            min-height: 70px;
        }
        
        .word-item.showing-chinese .word-english {
            color: #d32f2f;
            font-weight: 700;
        }
        
        /* 自动朗读时的样式 */
        .word-item.auto-speaking {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.15), rgba(33, 150, 243, 0.25));
            border-left: 3px solid #2196F3;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.2);
            transform: translateY(-2px);
        }
        
        .word-item.auto-speaking .word-english {
            color: #1976D2;
            font-weight: 700;
        }
        
        .word-item.auto-speaking .word-chinese {
            color: #E91E63;
            font-weight: 600;
        }
        
        /* 单词文本样式 - 词根词缀分色 */
        .word-english {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 3px;
            font-family: 'Georgia', 'Times New Roman', serif;
            letter-spacing: -0.2px;
            line-height: 1.2;
            transition: all 0.3s ease;
            max-width: 100%;
        }
        
        /* 词根词缀分色显示 */
        .word-part {
            display: inline;
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        
        .word-prefix {
            color: #FF5722; /* 前缀 - 橙色 */
            font-weight: 700;
        }
        
        .word-root {
            color: #4CAF50; /* 词根 - 绿色 */
            font-weight: 700;
        }
        
        .word-suffix {
            color: #2196F3; /* 后缀 - 蓝色 */
            font-weight: 700;
        }
        
        .word-base {
            color: #9C27B0; /* 基础词 - 紫色 */
            font-weight: 700;
        }
        
        .word-separator {
            color: #999;
            margin: 0 1px;
        }
        
        .word-chinese {
            font-size: 14px;
            color: #7b1fa2;
            font-weight: 500;
            opacity: 0;
            transform: translateY(3px);
            transition: all 0.3s ease;
            font-family: 'STKaiti', 'KaiTi', serif;
            line-height: 1.2;
            max-width: 100%;
            margin-bottom: 2px;
        }
        
        .word-tip {
            font-size: 12px;
            color: #666;
            font-style: italic;
            opacity: 0;
            transform: translateY(3px);
            transition: all 0.3s ease;
            line-height: 1.3;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 4px;
            border-radius: 3px;
            border-left: 2px solid #ff9800;
        }
        
        /* 词根词缀说明 */
        .affix-explanation {
            font-size: 11px;
            color: #666;
            opacity: 0;
            transform: translateY(3px);
            transition: all 0.3s ease;
            line-height: 1.3;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 4px;
            border-radius: 3px;
            border-left: 2px solid #4CAF50;
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        
        .affix-item {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .affix-prefix-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FF5722;
            display: inline-block;
        }
        
        .affix-root-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            display: inline-block;
        }
        
        .affix-suffix-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2196F3;
            display: inline-block;
        }
        
        .affix-base-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9C27B0;
            display: inline-block;
        }
        
        .word-item.showing-chinese .word-chinese,
        .word-item.showing-chinese .word-tip,
        .word-item.showing-chinese .affix-explanation {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 词根词缀切换按钮 */
        .affix-toggle-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            width: 24px;
            height: 24px;
            border-radius: 12px;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4CAF50;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .affix-toggle-btn:hover {
            background: rgba(76, 175, 80, 0.3);
        }
        
        .affix-toggle-btn:active {
            transform: scale(0.9);
        }
        
        /* 控制栏 */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            padding: 0 5px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            background: linear-gradient(135deg, #8d6e63, #5d4037);
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(93, 64, 55, 0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 110px;
            justify-content: center;
        }
        
        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(93, 64, 55, 0.2);
        }
        
        .control-btn.shuffle-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }
        
        .control-btn.auto-speak-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        
        .control-btn.auto-speak-btn.active {
            background: linear-gradient(135deg, #f44336, #c62828);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3); }
            50% { box-shadow: 0 5px 25px rgba(244, 67, 54, 0.6); }
            100% { box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3); }
        }
        
        /* 设置栏 */
        .settings-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 13px;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .setting-item input[type="number"] {
            width: 50px;
            padding: 4px 6px;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.9);
            text-align: center;
            font-size: 13px;
        }
        
        .setting-item select {
            padding: 4px 6px;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 13px;
        }
        
        /* 页码指示器 */
        .page-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            color: white;
        }
        
        .page-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .page-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        .page-info {
            font-size: 14px;
            min-width: 80px;
            text-align: center;
            font-weight: 500;
        }
        
        /* 菜单 */
        .menu {
            display: none;
            position: fixed;
            top: 60px;
            right: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            min-width: 180px;
            z-index: 1000;
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .menu-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        
        .menu-item:active {
            background: #f5f5f5;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-icon {
            margin-right: 10px;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 16px 35px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .modal-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #333;
            text-align: center;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #666;
            font-weight: 500;
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #8d6e63;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-btn-confirm {
            background: #8d6e63;
            color: white;
        }
        
        .modal-btn-confirm:active {
            background: #5d4037;
        }
        
        .modal-btn-cancel {
            background: #f5f5f5;
            color: #666;
        }
        
        .modal-btn-cancel:active {
            background: #e0e0e0;
        }
        
        /* 提示信息 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 3000;
            display: none;
            animation: toastSlideUp 0.3s ease;
        }
        
        @keyframes toastSlideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* 空状态 */
        .empty-state {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            max-width: 250px;
        }
        
        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        /* 页面切换动画 */
        .page-transition {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        /* 语音动画 */
        .speaking-dot {
            position: absolute;
            right: 5px;
            top: 5px;
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .word-item.speaking .speaking-dot {
            opacity: 1;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        
        /* 自动朗读状态指示器 */
        .auto-speak-status {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
            align-items: center;
            gap: 8px;
        }
        
        .auto-speak-status.active {
            display: flex;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* 响应式调整 */
        @media (max-width: 430px) {
            body {
                padding: 8px;
            }
            
            .paper-container {
                padding: 12px;
                border-width: 5px;
                min-height: 65vh;
            }
            
            .columns-container {
                top: 12px;
                left: 12px;
                right: 12px;
                bottom: 12px;
                gap: 8px;
            }
            
            .column {
                padding: 8px;
                gap: 8px;
            }
            
            .control-bar {
                gap: 8px;
            }
            
            .control-btn {
                padding: 10px 14px;
                min-width: 100px;
                font-size: 13px;
            }
            
            .settings-bar {
                flex-direction: column;
                gap: 8px;
                padding: 8px;
            }
            
            .setting-item {
                width: 100%;
                justify-content: space-between;
            }
            
            .word-item {
                padding: 7px 9px;
                min-height: 50px;
            }
            
            .word-item.showing-chinese {
                min-height: 85px;
            }
            
            .word-english {
                font-size: 15px;
            }
            
            .word-chinese {
                font-size: 13px;
            }
            
            .word-tip {
                font-size: 11px;
            }
            
            .affix-explanation {
                font-size: 10px;
            }
            
            .affix-toggle-btn {
                width: 22px;
                height: 22px;
                font-size: 11px;
            }
            
            .auto-speak-status {
                top: 65px;
                font-size: 11px;
                padding: 6px 12px;
            }
        }
        
        /* iPhone 14 Pro Max */
        @media (max-width: 430px) and (min-height: 900px) {
            .paper-container {
                min-height: 68vh;
            }
            
            .word-item {
                min-height: 50px;
                padding: 8px 10px;
            }
            
            .word-item.showing-chinese {
                min-height: 85px;
            }
        }
        
        /* 横屏模式 */
        @media (orientation: landscape) {
            .paper-container {
                min-height: 75vh;
            }
            
            .columns-container {
                gap: 15px;
            }
            
            .column {
                gap: 12px;
            }
            
            .word-english {
                font-size: 16px;
            }
            
            .word-chinese {
                font-size: 14px;
            }
            
            .word-tip {
                font-size: 12px;
            }
            
            .settings-bar {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .setting-item {
                flex: 0 0 auto;
            }
        }
        
        /* 屏幕很小时使用2列 */
        @media (max-width: 360px) {
            .columns-container {
                flex-direction: column;
                gap: 5px;
            }
            
            .column {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: space-between;
            }
            
            .word-item {
                width: calc(50% - 4px);
                min-height: 45px;
                padding: 6px 8px;
            }
            
            .word-item.showing-chinese {
                min-height: 80px;
            }
            
            .control-btn {
                padding: 8px 12px;
                min-width: 90px;
                font-size: 12px;
            }
            
            .affix-toggle-btn {
                right: 5px;
                top: 5px;
                width: 20px;
                height: 20px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部控制栏 -->
        <div class="top-bar">
            <div class="app-title">
                <span>📚</span>
                <span>单词学习</span>
            </div>
            <button class="menu-btn" id="menuBtn">⋮</button>
        </div>
        
        <!-- 纸张效果容器 -->
        <div class="paper-container" id="paperContainer">
            <!-- 页面内容会动态生成 -->
        </div>

        // 初始化语音功能
        function initSpeech() {
            if ('speechSynthesis' in window) {

            } else {
                showToast('您的浏览器不支持语音功能');
            }
        }
        
        // 朗读文本
        function speakText(text, lang = 'en-US', callback = null) {
            if (!speech) initSpeech();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.8;
            utterance.pitch = 1.0;
            
            if (callback) {
                utterance.onend = callback;
            }
            
            speech.speak(utterance);
        }
        
        // 朗读单词
        function speakWord(wordData, wordElement, lang = 'en-US') {
            if (!speech) initSpeech();
            if (isSpeaking && !isAutoSpeaking) return;
            
            if (wordElement) {
                wordElement.classList.add('speaking');
            }
            
            isSpeaking = true;
            
            const utterance = new SpeechSynthesisUtterance(wordData.english);
            utterance.lang = lang;
            utterance.rate = 0.8;
            utterance.pitch = 1.0;
            
            utterance.onstart = function() {
                if (wordElement) {
                    wordElement.classList.add('speaking');
                }
            };
            
            utterance.onend = function() {
                isSpeaking = false;
                if (wordElement) {
                    wordElement.classList.remove('speaking');
                }
            };
            
            utterance.onerror = function() {
                isSpeaking = false;
                if (wordElement) {
                    wordElement.classList.remove('speaking');
                }
                if (!isAutoSpeaking) {
                    showToast('朗读失败，请重试');
                }
            };
            
            speech.speak(utterance);
        }

            ];
            
            // 常见词根识别
            const roots = [

                if (rootPart.includes(r.root) && r.root.length > foundRoot.length) {
                    foundRoot = r.root;
                    foundRootMeaning = r.meaning;
                }
            }
            
            // 构建分析结果
            if (foundPrefix) {
                parts.push(foundPrefix);
                types.push("前缀");
                meanings.push(foundPrefixMeaning);
            }
            
            if (foundRoot) {
                parts.push(foundRoot);
                types.push("词根");
                meanings.push(foundRootMeaning);
            } else if (rootPart) {
                parts.push(rootPart);
                types.push("基础词");
                meanings.push(word.chinese);
            }
            
            if (foundSuffix) {
                parts.push(foundSuffix);
                types.push("后缀");
                meanings.push(foundSuffixMeaning);
            }
            
            // 生成完整含义
            if (parts.length > 0) {
                fullMeaning = parts.map((part, i) => {
                    return `${part}(${meanings[i]})`;
                }).join(" + ") + " = " + word.chinese;
            } else {
                fullMeaning = word.english + " = " + word.chinese;
            }
            
            return {
                parts: parts,
                types: types,
                meanings: meanings,
                fullMeaning: fullMeaning
            };
        }
        
        // 生成词根词缀分色的HTML
        function generateAffixHTML(word) {
            const analysis = analyzeWordAffixes(word);
            const parts = analysis.parts;
            const types = analysis.types;
            
            if (!affixModeEnabled || parts.length <= 1) {
                return `<span class="word-part">${word.english}</span>`;
            }
            
            let html = '';
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                const type = types[i];
                
                let className = 'word-part';
                if (type === '前缀') {
                    className += ' word-prefix';
                } else if (type === '词根') {
                    className += ' word-root';
                } else if (type === '后缀') {
                    className += ' word-suffix';
                } else if (type === '基础词') {
                    className += ' word-base';
                }
                
                html += `<span class="${className}">${part}</span>`;
                
                // 如果不是最后一个部分，添加分隔符
                if (i < parts.length - 1) {
                    html += `<span class="word-separator">-</span>`;
                }
            }
            
            return html;
        }
        
        // 生成词根词缀说明HTML
        function generateAffixExplanationHTML(word) {
            const analysis = analyzeWordAffixes(word);
            const parts = analysis.parts;
            const types = analysis.types;
            const meanings = analysis.meanings;
            
            if (!affixModeEnabled || parts.length <= 1) {
                return '';
            }
            
            let html = '<div class="affix-explanation">';
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                const type = types[i];
                const meaning = meanings[i];
                
                let dotClass = '';
                if (type === '前缀') {
                    dotClass = 'affix-prefix-dot';
                } else if (type === '词根') {
                    dotClass = 'affix-root-dot';
                } else if (type === '后缀') {
                    dotClass = 'affix-suffix-dot';
                } else if (type === '基础词') {
                    dotClass = 'affix-base-dot';
                }
                
                html += `<div class="affix-item"><span class="${dotClass}"></span> ${part}: ${meaning}</div>`;
            }
            html += '</div>';
            
            return html;
        }
        
        // 计算总页数
        function getTotalPages() {
            return Math.ceil(words.length / WORDS_PER_PAGE);
        }
        
        // 获取当前页的单词
        function getCurrentPageWords() {
            const startIndex = currentPage * WORDS_PER_PAGE;
            const endIndex = startIndex + WORDS_PER_PAGE;
            return words.slice(startIndex, endIndex);
        }
        
        // 分栏布局算法
        function generateColumnLayout(wordList) {
            const pageWords = [...wordList];
            
            // 随机打乱单词顺序
            for (let i = pageWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pageWords[i], pageWords[j]] = [pageWords[j], pageWords[i]];
            }
            
            // 将单词分配到3列中
            const columns = [[], [], []];
            
            pageWords.forEach((word, index) => {
                const columnIndex = index % 3;
                columns[columnIndex].push(word);
            });
            
            return columns;
        }
        
        // 渲染当前页面
        function renderCurrentPage() {
            const container = document.getElementById('paperContainer');
            const totalPages = getTotalPages();
            const pageWords = getCurrentPageWords();
            
            // 清空容器
            container.innerHTML = '';
            
            if (words.length === 0) {
                // 显示空状态
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <div class="empty-icon">📚</div>
                    <div class="empty-text">词库为空，开始添加单词吧！</div>
                    <button class="control-btn" onclick="showAddWordModal()" style="margin: 0 auto;">
                        <span>➕</span> 添加第一个单词
                    </button>
                `;
                container.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }
            
            // 创建页面容器
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page active';
            
            // 创建分栏容器
            const columnsContainer = document.createElement('div');
            columnsContainer.className = 'columns-container';
            
            if (pageWords.length > 0) {
                // 生成分栏布局
                const columns = generateColumnLayout(pageWords);
                
                // 创建3列
                for (let colIndex = 0; colIndex < 3; colIndex++) {
                    const columnDiv = document.createElement('div');
                    columnDiv.className = 'column';
                    
                    // 为该列的每个单词创建单词项
                    columns[colIndex].forEach(word => {
                        const wordItem = document.createElement('div');
                        wordItem.className = 'word-item';
                        wordItem.dataset.english = word.english;
                        wordItem.dataset.chinese = word.chinese;
                        wordItem.dataset.tip = word.tip || '';
                        
                        // 添加英文（带词根词缀分色）
                        const englishDiv = document.createElement('div');
                        englishDiv.className = 'word-english';
                        englishDiv.innerHTML = generateAffixHTML(word);
                        
                        // 添加中文
                        const chineseDiv = document.createElement('div');
                        chineseDiv.className = 'word-chinese';
                        chineseDiv.textContent = word.chinese;
                        
                        // 添加记忆窍门（如果有）
                        let tipDiv = null;
                        if (word.tip && word.tip.trim() !== '') {
                            tipDiv = document.createElement('div');
                            tipDiv.className = 'word-tip';
                            tipDiv.textContent = word.tip;
                        }
                        
                        // 添加词根词缀说明
                        const affixExplanationDiv = document.createElement('div');
                        affixExplanationDiv.innerHTML = generateAffixExplanationHTML(word);
                        
                        // 添加词根词缀切换按钮
                        const affixToggleBtn = document.createElement('button');
                        affixToggleBtn.className = 'affix-toggle-btn';
                        affixToggleBtn.innerHTML = '🎨';
                        affixToggleBtn.title = '切换词根词缀分色显示';
                        affixToggleBtn.onclick = function(e) {
                            e.stopPropagation();
                            toggleWordAffixMode(wordItem, word);
                        };
                        
                        // 添加语音指示点
                        const speakingDot = document.createElement('div');
                        speakingDot.className = 'speaking-dot';
                        
                        wordItem.appendChild(englishDiv);
                        wordItem.appendChild(chineseDiv);
                        if (tipDiv) {
                            wordItem.appendChild(tipDiv);
                        }
                        wordItem.appendChild(affixExplanationDiv);
                        wordItem.appendChild(affixToggleBtn);
                        wordItem.appendChild(speakingDot);
                        
                        // 点击事件
                        wordItem.addEventListener('click', function(e) {
                            e.stopPropagation();
                            
                            // 如果正在自动朗读，则停止自动朗读
                            if (isAutoSpeaking) {
                                stopAutoSpeak();
                                return;
                            }
                            
                            // 朗读单词
                            speakWord(word, this);
                            
                            // 显示中文和记忆窍门
                            this.classList.add('showing-chinese');
                            
                            // 5秒后自动隐藏中文和记忆窍门
                            setTimeout(() => {
                                this.classList.remove('showing-chinese');
                            }, 5000);
                            
                            // 点击动画
                            this.style.transform = 'scale(0.98)';
                            
                            setTimeout(() => {
                                this.style.transform = 'scale(1)';
                            }, 200);
                        });
                        
                        columnDiv.appendChild(wordItem);
                    });
                    
                    columnsContainer.appendChild(columnDiv);
                }
            }
            
            pageDiv.appendChild(columnsContainer);
            container.appendChild(pageDiv);
            updatePageInfo();
        }
        
        // 切换单个单词的词根词缀分色
        function toggleWordAffixMode(wordItem, word) {
            const englishDiv = wordItem.querySelector('.word-english');
            const affixExplanationDiv = wordItem.querySelector('.affix-explanation');
            
            // 如果当前没有分色，则应用分色
            if (englishDiv.innerHTML.includes('word-part')) {
                // 移除分色，显示普通文本
                englishDiv.innerHTML = `<span class="word-part">${word.english}</span>`;
                if (affixExplanationDiv) {
                    affixExplanationDiv.style.display = 'none';
                }
                showToast('已关闭词根词缀分色');
            } else {
                // 应用分色
                englishDiv.innerHTML = generateAffixHTML(word);
                if (affixExplanationDiv) {
                    affixExplanationDiv.style.display = '';
                }
                showToast('已开启词根词缀分色');
            }
        }

        // 自动朗读功能
        function toggleAutoSpeak() {
            if (isAutoSpeaking) {
                stopAutoSpeak();
            } else {
                startAutoSpeak();
            }
        }
        
        function startAutoSpeak() {
            if (words.length === 0) {
                showToast('词库为空，无法开始自动朗读');
                return;
            }
            
            isAutoSpeaking = true;
            autoSpeakIndex = 0;
            
            // 更新按钮状态
            const btn = document.getElementById('autoSpeakBtn');
            btn.innerHTML = '<span>⏸️</span> 停止自动朗读';
            btn.classList.add('active');
            
            // 显示状态指示器
            const status = document.getElementById('autoSpeakStatus');
            const statusText = document.getElementById('autoSpeakStatusText');
            const progress = document.getElementById('autoSpeakProgress');
            
            status.classList.add('active');
            
            // 开始朗读
            speakNextWordInAutoMode();

        function stopAutoSpeak() {
            isAutoSpeaking = false;
            
            // 清除所有超时
            if (autoSpeakTimeout) {
                clearTimeout(autoSpeakTimeout);
                autoSpeakTimeout = null;
            }
            
            // 停止语音
            if (speech) {
                speech.cancel();
            }
            
            // 更新按钮状态
            const btn = document.getElementById('autoSpeakBtn');
            btn.innerHTML = '<span>🔊</span> 开始自动朗读';
            btn.classList.remove('active');
            
            // 隐藏状态指示器
            document.getElementById('autoSpeakStatus').classList.remove('active');
            
            // 移除所有高亮
            document.querySelectorAll('.word-item.auto-speaking').forEach(item => {
                item.classList.remove('auto-speaking');
                item.classList.remove('showing-chinese');
            });
            
            showToast('自动朗读已停止');
        }
        
        function speakNextWordInAutoMode() {
            if (!isAutoSpeaking) return;
            
            const pageWords = getCurrentPageWords();
            const totalPages = getTotalPages();
            
            if (pageWords.length === 0) {
                stopAutoSpeak();
                return;
            }
            
            // 更新状态指示器
            const statusText = document.getElementById('autoSpeakStatusText');
            const progress = document.getElementById('autoSpeakProgress');
            const mode = document.getElementById('speakMode').value;
            const loopMode = document.getElementById('loopMode').value;
            
            statusText.textContent = `自动朗读中 - ${mode === 'english-only' ? '仅英文' : mode === 'both' ? '英+中' : '英+中+窍门'}`;
            progress.textContent = `(${autoSpeakIndex + 1}/${pageWords.length})`;
            
            // 如果当前单词索引超出范围
            if (autoSpeakIndex >= pageWords.length) {
                if (loopMode === 'page') {
                    // 本页循环，重置索引
                    autoSpeakIndex = 0;
                } else {
                    // 全部循环，尝试翻页
                    if (currentPage < totalPages - 1) {
                        currentPage++;
                        renderCurrentPage();
                        autoSpeakIndex = 0;
                        // 等待页面渲染完成后继续朗读
                        setTimeout(() => {
                            speakNextWordInAutoMode();
                        }, 500);
                        return;
                    } else {
                        // 已经是最后一页，回到第一页
                        currentPage = 0;
                        renderCurrentPage();
                        autoSpeakIndex = 0;
                        setTimeout(() => {
                            speakNextWordInAutoMode();
                        }, 500);
                        return;
                    }
                }
            }
            
            const word = pageWords[autoSpeakIndex];
            const wordElement = getWordElementByEnglish(word.english);
            
            if (!wordElement) {
                autoSpeakIndex++;
                autoSpeakTimeout = setTimeout(speakNextWordInAutoMode, 100);
                return;
            }
            
            // 高亮当前单词
            document.querySelectorAll('.word-item.auto-speaking').forEach(item => {
                item.classList.remove('auto-speaking');
                item.classList.remove('showing-chinese');
            });
            wordElement.classList.add('auto-speaking');
            
            // 根据模式朗读
            const speakMode = document.getElementById('speakMode').value;
            const interval = parseInt(document.getElementById('speakInterval').value) * 1000;
            
            if (speakMode === 'english-only') {
                // 仅朗读英文
                wordElement.classList.add('showing-chinese');
                speakText(word.english, 'en-US', () => {
                    setTimeout(() => {
                        wordElement.classList.remove('showing-chinese');
                        autoSpeakIndex++;
                        autoSpeakTimeout = setTimeout(speakNextWordInAutoMode, interval);
                    }, 500);
                });
            } else if (speakMode === 'both') {
                // 朗读英文和中文
                wordElement.classList.add('showing-chinese');
                speakText(word.english, 'en-US', () => {
                    setTimeout(() => {
                        speakText(word.chinese, 'zh-CN', () => {
                            setTimeout(() => {
                                wordElement.classList.remove('showing-chinese');
                                autoSpeakIndex++;
                                autoSpeakTimeout = setTimeout(speakNextWordInAutoMode, interval);
                            }, 500);
                        });
                    }, 500);
                });
            } else if (speakMode === 'english-chinese-tip') {
                // 朗读英文、中文和窍门
                wordElement.classList.add('showing-chinese');
                speakText(word.english, 'en-US', () => {
                    setTimeout(() => {
                        speakText(word.chinese, 'zh-CN', () => {
                            if (word.tip && word.tip.trim() !== '') {
                                setTimeout(() => {
                                    speakText(word.tip, 'zh-CN', () => {
                                        setTimeout(() => {
                                            wordElement.classList.remove('showing-chinese');
                                            autoSpeakIndex++;
                                            autoSpeakTimeout = setTimeout(speakNextWordInAutoMode, interval);
                                        }, 500);
                                    });
                                }, 500);
                            } else {
                                setTimeout(() => {
                                    wordElement.classList.remove('showing-chinese');
                                    autoSpeakIndex++;
                                    autoSpeakTimeout = setTimeout(speakNextWordInAutoMode, interval);
                                }, 500);
                            }
                        });
                    }, 500);
                });
            }
        }

        // 页面切换动画

        // 触摸事件处理
        function initTouchEvents() {
            const container = document.getElementById('paperContainer');
            const SWIPE_THRESHOLD = 50;
            
            container.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            container.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            container.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                
                if (Math.abs(diff) > SWIPE_THRESHOLD) {
                    if (diff > 0) {
                        prevPage();
                    } else {
                        nextPage();
                    }
                }
            }, { passive: true });
        }

        // 添加单词（现在包含affixAnalysis字段）
        function addWord() {
            const english = document.getElementById('englishInput').value.trim();
            const chinese = document.getElementById('chineseInput').value.trim();
            const tip = document.getElementById('tipInput').value.trim();
            const affix = document.getElementById('affixInput').value.trim();
            
            if (!english) {
                showToast('请输入英文单词');
                document.getElementById('englishInput').focus();
                return;
            }
            
            if (!chinese) {
                showToast('请输入中文释义');
                document.getElementById('chineseInput').focus();
                return;
            }
            
            const exists = words.some(w => w.english.toLowerCase() === english.toLowerCase());
            if (exists) {
                showToast('该单词已存在');
                return;
            }
            
            // 创建单词对象
            const newWord = { english, chinese, tip };
            
            // 如果有词根词缀信息，尝试解析
            if (affix) {
                try {
                    // 尝试解析手动输入的词根词缀信息
                    const affixParts = affix.split(/[,\/]/);
                    const parts = [];
                    const types = [];
                    const meanings = [];
                    
                    for (let part of affixParts) {
                        const match = part.match(/(.+?)[:：]\s*(.+)/);
                        if (match) {
                            const affixPart = match[1].trim();
                            const meaning = match[2].trim();
                            
                            // 判断类型
                            let type = "词根";
                            if (affixPart.endsWith('-') || affixPart.includes('前缀')) {
                                type = "前缀";
                            } else if (affixPart.startsWith('-') || affixPart.includes('后缀')) {
                                type = "后缀";
                            } else if (affixPart.includes('词根')) {
                                type = "词根";
                            } else if (affixPart.includes('基础')) {
                                type = "基础词";
                            }
                            
                            // 提取实际的部分
                            const cleanPart = affixPart.replace(/[-\s前缀后缀词根基础词]/g, '');
                            if (cleanPart) {
                                parts.push(cleanPart);
                                types.push(type);
                                meanings.push(meaning);
                            }
                        }
                    }
                    
                    if (parts.length > 0) {
                        newWord.affixAnalysis = {
                            parts: parts,
                            types: types,
                            meanings: meanings,
                            fullMeaning: affix
                        };
                    }
                } catch (e) {
                    console.error('解析词根词缀失败:', e);
                }
            }
            
            words.push(newWord);
            
            const oldTotalPages = getTotalPages();
            const newTotalPages = Math.ceil(words.length / WORDS_PER_PAGE);
            
            if (newTotalPages > oldTotalPages) {
                currentPage = newTotalPages - 1;
            }
            
            updateDisplay();
            hideAddWordModal();
            showToast('单词添加成功！');
        }
        
        // 导入词库（现在支持affixAnalysis字段）
        function importWords() {
            const json = document.getElementById('importInput').value.trim();
            
            if (!json) {
                showToast('请输入JSON内容');
                return;
            }
            
            try {
                const imported = JSON.parse(json);
                
                if (!Array.isArray(imported)) {
                    showToast('JSON必须是数组格式');
                    return;
                }
                
                // 验证格式
                for (let item of imported) {
                    if (!item.english || !item.chinese) {
                        showToast('每个单词必须包含english和chinese字段');
                        return;
                    }
                    if (item.tip === undefined) {
                        item.tip = '';
                    }
                    if (item.affixAnalysis === undefined) {
                        item.affixAnalysis = null;
                    }
                }
                
                words = imported;
                currentPage = 0;
                updateDisplay();
                hideImportModal();
                showToast(`成功导入${words.length}个单词`);
                
            } catch (e) {
                showToast('JSON格式错误，请检查');
                console.error(e);
            }
        }
        
        // 导出词库（现在包含affixAnalysis字段）
        function exportWords() {
            if (words.length === 0) {
                showToast('词库为空，无法导出');
                return;
            }
            
            const json = JSON.stringify(words, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `单词词库_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            URL.revokeObjectURL(url);
            showToast('词库已导出为JSON文件');
        }
        
        // 清空词库
        function clearWords() {
            if (isAutoSpeaking) {
                stopAutoSpeak();
            }
            
            words = [];
            currentPage = 0;
            updateDisplay();
            hideClearModal();
            showToast('词库已清空');
        }
        
        // 显示帮助
        function showHelp() {
            const helpText = 
                '📱 使用帮助：\n\n' +
                '1. 点击单词：朗读发音并显示中文和记忆窍门\n' +
                '2. 左右滑动纸张：切换页面（每页20词）\n' +
                '3. 乱序排列：重新排列当前页单词位置\n' +
                '4. 自动朗读：适合开车学习，自动朗读单词和中文\n' +
                '5. 词根词缀分色：用不同颜色显示单词的前缀、词根和后缀\n' +
                '6. 词根词缀说明：点击单词显示词根词缀的含义\n' +
                '7. 设置间隔时间：控制自动朗读的停顿时间\n' +
                '8. 选择模式：仅英文、英文+中文、英文+中文+窍门\n' +
                '9. 循环模式：本页循环或全部循环\n' +
                '10. 添加单词：右上角菜单 → 添加单词（可添加词根词缀信息）\n' +
                '11. 导入/导出词库：备份和恢复词库\n\n' +
                '🎨 词根词缀分色说明：\n' +
                '   🔴 橙色：前缀（如re-, un-, dis-）\n' +
                '   🟢 绿色：词根（如cept, ceive, fac）\n' +
                '   🔵 蓝色：后缀（如-ing, -ed, -tion）\n' +
                '   🟣 紫色：基础词（没有明显词根词缀）\n\n' +
                '🚗 开车模式：\n' +
                '点击"开始自动朗读"，选择模式和间隔时间，即可自动学习\n\n' +
                '📱 添加到主屏幕：\n' +
                '用Safari打开 → 分享 → 添加到主屏幕';
            
            alert(helpText);
            hideMenu();
        }
        
        // 更新显示
        function updateDisplay() {
            renderCurrentPage();
            saveToLocalStorage();
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            try {
                localStorage.setItem('wordLearnerData', JSON.stringify(words));
                localStorage.setItem('wordLearnerPage', currentPage.toString());
                localStorage.setItem('wordLearnerAffixMode', affixModeEnabled.toString());
                // 保存设置
                const settings = {
                    interval: document.getElementById('speakInterval').value,
                    mode: document.getElementById('speakMode').value,
                    loop: document.getElementById('loopMode').value
                };
                localStorage.setItem('wordLearnerSettings', JSON.stringify(settings));
            } catch (e) {
                console.error('保存到本地存储失败:', e);
            }
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('wordLearnerData');
                if (saved) {
                    words = JSON.parse(saved);
                }
                
                const savedPage = localStorage.getItem('wordLearnerPage');
                if (savedPage) {
                    const page = parseInt(savedPage);
                    const totalPages = Math.ceil(words.length / WORDS_PER_PAGE);
                    if (!isNaN(page) && page >= 0 && page < totalPages) {
                        currentPage = page;
                    }
                }
                
                const savedAffixMode = localStorage.getItem('wordLearnerAffixMode');
                if (savedAffixMode !== null) {
                    affixModeEnabled = savedAffixMode === 'true';
                }
                
                // 加载设置
                const savedSettings = localStorage.getItem('wordLearnerSettings');
                if (savedSettings) {
                    const settings = JSON.parse(savedSettings);
                    document.getElementById('speakInterval').value = settings.interval || 3;
                    document.getElementById('speakMode').value = settings.mode || 'both';
                    document.getElementById('loopMode').value = settings.loop || 'page';
                }
            } catch (e) {
                console.error('从本地存储加载失败:', e);
            }
        }
        
        // 初始化
        function init() {
            initSpeech();
            loadFromLocalStorage();
            renderCurrentPage();
            initTouchEvents();
            
            // 更新菜单显示
            const affixModeIcon = document.getElementById('affixModeIcon');
            const affixModeText = document.getElementById('affixModeText');
            if (affixModeEnabled) {
                affixModeIcon.textContent = '🎨';
                affixModeText.textContent = '关闭词根词缀分色';
            } else {
                affixModeIcon.textContent = '⚫';
                affixModeText.textContent = '开启词根词缀分色';
            }
            
            // 菜单按钮事件
            document.getElementById('menuBtn').addEventListener('click', toggleMenu);
            
            // 点击其他地方关闭菜单
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.menu') && !e.target.closest('.menu-btn')) {
                    hideMenu();
                }
            });
            
            // 点击模态框外部关闭模态框
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                    }
                });
            });
            
            // 输入框回车键支持
            document.getElementById('englishInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('chineseInput').focus();
                }
            });
            
            document.getElementById('chineseInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('tipInput').focus();
                }
            });
            
            document.getElementById('tipInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('affixInput').focus();
                }
            });
            
            document.getElementById('affixInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addWord();
                }
            });
            
            // 设置项变化时保存
            document.getElementById('speakInterval').addEventListener('change', saveToLocalStorage);
            document.getElementById('speakMode').addEventListener('change', saveToLocalStorage);
            document.getElementById('loopMode').addEventListener('change', saveToLocalStorage);
            
            // 窗口大小变化时重新渲染
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (words.length > 0) {
                        renderCurrentPage();
                    }
                }, 250);
            });
            
            // 页面卸载前停止自动朗读
            window.addEventListener('beforeunload', function() {
                if (isAutoSpeaking) {
                    stopAutoSpeak();
                }
            });
            
            // 注册Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js').then(
                        function(registration) {
                            console.log('ServiceWorker 注册成功:', registration.scope);
                        },
                        function(err) {
                            console.log('ServiceWorker 注册失败:', err);
                        }
                    );
                });
            }
            
            // 防止双击缩放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
